<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EngTree Viewer</title>
<link rel="icon" href="/assets/app_icon.ico">
<link rel="icon" type="image/png" href="/assets/icon_256.png">
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 10pt; }
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #1e1e2e; color: #e0e0e0; overflow: hidden; display: flex; flex-direction: column; }
  button { background: #2a2a3e; border: 1px solid #3a3a4e; border-radius: 5px; padding: 5px 12px; color: #e0e0e0; cursor: pointer; }
  button:hover:not(:disabled) { background: #34344a; border-color: #4a9eff; }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; }
  button.active { background: #4a9eff; border-color: #4a9eff; color: #fff; font-weight: 600; }
  input, select { background: #2a2a3e; border: 1px solid #3a3a4e; border-radius: 5px; padding: 6px 8px; color: #fff; }
  input:focus, select:focus { outline: none; border-color: #4a9eff; }

  #offline { display: none; background: #b91c1c; color: #fff; padding: 6px 14px; font-weight: 600; }
  .menubar { height: 40px; background: #2a2a3e; border-bottom: 1px solid #3a3a4e; display: flex; align-items: center; gap: 6px; padding: 0 12px; flex-shrink: 0; }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; margin-right: 14px; }
  .brand img { width: 22px; height: 22px; }
  .menu-item { cursor: pointer; padding: 5px 10px; border-radius: 4px; }
  .menu-item:hover { background: #4a9eff; color: #fff; }

  .tabbar { height: 34px; display: flex; align-items: flex-end; gap: 3px; padding: 4px 8px 0; border-bottom: 1px solid #3a3a4e; overflow-x: auto; flex-shrink: 0; }
  .tab { background: #2a2a3e; padding: 6px 12px; border-radius: 6px 6px 0 0; cursor: pointer; white-space: nowrap; display: flex; gap: 8px; align-items: center; }
  .tab.active { background: #4a9eff; color: #fff; font-weight: 600; }
  .tab .x { padding: 0 4px; border-radius: 3px; }
  .tab .x:hover { background: rgba(0,0,0,.3); }
  #workspace { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .pane { flex: 1; display: none; overflow: hidden; }
  .pane.active { display: flex; }

  .search-pane { display: flex; flex-direction: column; padding: 10px 14px; gap: 8px; width: 100%; height: 100%; min-height: 0; }
  .row { display: flex; gap: 8px; align-items: center; }
  .grow { flex: 1; }
  .muted { color: #9aa0b0; font-size: 9pt; }
  .table-wrap { flex: 1; min-height: 0; overflow: auto; border: 1px solid #3a3a4e; border-radius: 6px; background: #232336; }
  table { width: 100%; border-collapse: collapse; }
  th { position: sticky; top: 0; background: #2a2a3e; padding: 7px 10px; text-align: left; border-bottom: 1px solid #3a3a4e; white-space: nowrap; z-index: 1; }
  th.sortable { cursor: pointer; }
  th.sortable:hover { color: #fff; background: #34344a; }
  td { padding: 6px 10px; border-bottom: 1px solid #2f2f46; white-space: nowrap; }
  tbody tr:nth-child(even) { background: #292940; }
  tbody tr:hover { background: #343a58; cursor: pointer; }
  tr.sel, tr.sel:hover { background: #2563eb !important; color: #fff; }
  .empty { padding: 30px; color: #9aa0b0; line-height: 1.6; }

  .split { display: flex; width: 100%; height: 100%; }
  .left { width: 46%; min-width: 360px; min-height: 0; display: flex; flex-direction: column; padding: 8px; gap: 6px; }
  .divider { width: 5px; cursor: col-resize; background: #3a3a4e; flex-shrink: 0; }
  .divider:hover { background: #4a9eff; }
  .right { flex: 1; display: flex; flex-direction: column; padding: 8px; gap: 6px; min-width: 0; }
  .toggle { display: inline-block; width: 16px; color: #4a9eff; font-weight: 700; cursor: pointer; text-align: center; }
  .badge { display: inline-block; font-size: 8pt; padding: 1px 5px; margin-right: 3px; border-radius: 3px; background: #1f3a5f; color: #bfdbfe; }
  tr.sel .badge { background: rgba(255,255,255,.25); color: #fff; }
  tr.root td { font-weight: 600; }
  .pbadge { font-size: 8.5pt; padding: 1px 7px; margin-right: 4px; border-radius: 4px; background: #2f3550; border-color: #4a9eff; color: #cfe2ff; }
  .pbadge:hover { background: #4a9eff !important; color: #fff; }
  .pbadge.clip { background: #10b981; border-color: #059669; color: #fff; border-radius: 10px; }
  tr.sel .pbadge { border-color: #fff; }
  .chk { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .filelist { width: 100%; overflow: auto; }
  .filelist td { white-space: nowrap; }
  .filelist td.name { white-space: normal; word-break: break-word; width: 100%; }
  .filelist button { padding: 2px 8px; margin-left: 3px; }
  .stage video, .stage audio { max-width: 100%; max-height: 100%; margin: auto; }
  tr.dim td { opacity: .35; }
  .bar { display: flex; align-items: center; gap: 6px; background: #2a2a3e; padding: 5px 8px; border-radius: 5px; flex-wrap: wrap; }
  .bar .title { font-weight: 600; margin-right: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; }
  .meas { color: #ffd166; font-weight: 600; padding: 0 6px; }
  .stage { flex: 1; background: #191926; border: 1px solid #3a3a4e; border-radius: 6px; position: relative; overflow: hidden; display: flex; }
  .stage iframe { width: 100%; height: 100%; border: 0; background: #fff; }
  .stage img { max-width: 100%; max-height: 100%; margin: auto; object-fit: contain; }
  .stage pre { margin: 0; padding: 12px; overflow: auto; width: 100%; font-family: Consolas, monospace; font-size: 9pt; user-select: text; }
  canvas.cad-canvas { width: 100%; height: 100%; display: block; cursor: crosshair; }
  .warn { background: #3b2f0b; border: 1px solid #a16207; color: #fde68a; padding: 6px 10px; border-radius: 5px; font-size: 9pt; }

  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: #1e1e2e; border: 1px solid #4a9eff; border-radius: 8px; width: 820px; max-width: 95vw; max-height: 92vh; overflow: auto; padding: 18px 20px; }
  .modal h2 { margin: 0 0 12px; font-size: 13pt; }
  .modal h3 { margin: 16px 0 6px; font-size: 10.5pt; color: #93c5fd; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
  .field label { display: block; font-weight: 600; margin-bottom: 3px; color: #cfd3e0; }
  .field input { width: 100%; }
  .field .hint { font-size: 8.5pt; color: #8b90a0; margin-top: 2px; }
  .ft-table td, .ft-table th { padding: 4px; border: 0; background: none !important; }
  .ft-table input { width: 100%; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  a { color: #7cb7ff; cursor: pointer; }

  /* A list behaves like a list, not like a web page: dragging across rows
     selects rows, never text. Text stays selectable where it is content. */
  body { user-select: none; -webkit-user-select: none; }
  .stage pre, input, select, textarea, .pick { user-select: text; -webkit-user-select: text; }

  table.grid { table-layout: fixed; }
  table.grid td, table.grid th { overflow: hidden; text-overflow: ellipsis; }
  th { position: relative; }
  th .rz { position: absolute; top: 0; right: 0; width: 6px; height: 100%; cursor: col-resize; }
  th.dragging { opacity: .4; }
  th.dropzone { box-shadow: inset 3px 0 0 #4a9eff; }

  tr.rev td { color: #ff7a7a; }
  tr.rev.sel td { color: #ffe3e3; }
  tr.gone td { color: #8a8f9e; font-style: italic; }
  .legend { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

  .ctx { position: fixed; z-index: 100; background: #262636; border: 1px solid #4a5068;
         border-radius: 6px; padding: 4px; min-width: 200px; box-shadow: 0 10px 28px rgba(0,0,0,.55); }
  .ctx .it { padding: 6px 12px; border-radius: 4px; cursor: pointer; white-space: nowrap; }
  .ctx .it:hover { background: #4a9eff; color: #fff; }
  .ctx .it.dis { opacity: .35; pointer-events: none; }
  .ctx .grp { padding: 6px 12px 2px; font-size: 8.5pt; color: #8b90a0; }
  .ctx hr { border: 0; border-top: 1px solid #3a3a4e; margin: 4px 2px; }

  .rev-list { max-height: 50vh; overflow: auto; margin-top: 8px; }
  .rev-item { padding: 8px 10px; border: 1px solid #3a3a4e; border-radius: 6px; margin-bottom: 6px; }
  .rev-item.open { border-left: 3px solid #ff7a7a; }
  .rev-item.closed { border-left: 3px solid #10b981; }
  .rev-item.updated { border-left: 3px solid #f59e0b; }
  .rev-item .who { color: #9aa0b0; font-size: 9pt; margin-top: 2px; }
  .rev-item b { cursor: pointer; }
  textarea { width: 100%; background: #2a2a3e; border: 1px solid #3a3a4e; border-radius: 5px;
             color: #fff; padding: 6px 8px; font-family: inherit; resize: vertical; }
  .req { color: #ff9f9f; }
  .warnbox { background: #3b2f0b; border: 1px solid #a16207; color: #fde68a; padding: 6px 10px;
             border-radius: 5px; font-size: 9pt; margin: 8px 0; }
</style>
</head>
<body>
<div id="offline" data-i18n="offline_bar"></div>

<div class="menubar">
  <div class="brand"><img src="/assets/icon_256.png" alt="">EngTree Viewer</div>
  <span class="menu-item" onclick="refreshList()">⟳ <span data-i18n="refresh"></span></span>
  <span class="menu-item" id="rev-btn" onclick="openRevPanel()" style="display:none"></span>
  <span class="menu-item" onclick="openSettings()">⚙ <span data-i18n="settings"></span></span>
  <span class="menu-item" onclick="openAbout()">ⓘ <span data-i18n="about"></span></span>
  <span class="grow"></span>
  <span class="muted" id="mode-label"></span>
</div>

<div class="tabbar" id="tabbar">
  <div class="tab active" id="tab-btn-home" onclick="activateTab('home')" data-i18n="products"></div>
  <div class="tab" id="tab-btn-parts" onclick="activateTab('parts')" data-i18n="parts_tab"></div>
</div>

<div id="workspace">
  <div class="pane active" id="pane-home">
    <div class="search-pane">
      <div class="row">
        <input id="q" class="grow" data-i18n-ph="search_ph" oninput="debounce(loadProducts, 200)()" autofocus>
      </div>
      <div class="table-wrap" id="products-wrap"></div>
      <div class="row">
        <div class="muted" id="list-status"></div>
        <span class="grow"></span>
        <div class="muted legend" id="legend"></div>
      </div>
    </div>
  </div>
  <div class="pane" id="pane-parts">
    <div class="search-pane">
      <div class="row" style="flex-wrap: wrap">
        <input id="pq" class="grow" style="min-width: 240px" data-i18n-ph="parts_search_ph" oninput="debounce(loadParts, 250)()">
        <span class="row" id="parts-filters" style="flex-wrap: wrap"></span>
      </div>
      <div class="table-wrap" id="parts-wrap"></div>
      <div class="muted" id="parts-status"></div>
    </div>
  </div>
</div>

<!-- Settings -->
<div class="modal-bg" id="settings">
  <div class="modal">
    <h2 data-i18n="settings"></h2>
    <h3 data-i18n="s_mode_h"></h3>
    <div class="grid2">
      <div class="field"><label data-i18n="s_lang"></label>
        <select id="s-lang" style="width:100%">
          <option value="" data-i18n="s_lang_auto"></option>
          <option value="en">English</option>
          <option value="pt-BR">Português (Brasil)</option>
        </select></div>
      <div class="field"><label data-i18n="mode"></label>
        <select id="s-mode" style="width:100%">
          <option value="production" data-i18n="mode_production"></option>
          <option value="engineering" data-i18n="mode_engineering"></option>
        </select>
        <div class="hint" data-i18n="mode_hint"></div></div>
      <div class="field" style="grid-column: span 2"><label data-i18n="s_shared"></label><input id="s-shared">
        <div class="hint" data-i18n="s_shared_hint"></div></div>
    </div>
    <div id="shared-note"></div>
    <h3 data-i18n="s_bom_h"></h3>
    <div class="grid2">
      <div class="field" style="grid-column: span 2"><label data-i18n="s_bom_folder"></label><input id="s-bom-folder" data-i18n-ph="s_bom_folder_ph">
        <div class="hint" data-i18n="s_bom_folder_hint"></div></div>
      <div class="field"><label data-i18n="s_bom_prefix"></label><input id="s-bom-prefix" data-i18n-ph="s_bom_prefix_ph">
        <div class="hint" data-i18n="s_bom_prefix_hint"></div></div>
      <div class="field"><label data-i18n="s_sep"></label><input id="s-sep" placeholder=" - "></div>
      <div class="field"><label data-i18n="s_det_prefix"></label><input id="s-det-prefix" data-i18n-ph="s_det_prefix_ph">
        <div class="hint" data-i18n="s_det_prefix_hint"></div></div>
      <div class="field"><label data-i18n="s_det_file"></label><input id="s-det-file" data-i18n-ph="s_det_file_ph"></div>
      <div class="field" style="grid-column: span 2"><label data-i18n="s_products_folder"></label><input id="s-products-folder">
        <div class="hint" data-i18n="s_products_hint"></div></div>
      <div class="field" style="grid-column: span 2"><label>📎 <span data-i18n="s_ref_folder"></span></label><input id="s-ref-folder">
        <div class="hint" data-i18n="s_ref_hint"></div></div>
      <div class="field" style="grid-column: span 2"><label data-i18n="s_rev_folder"></label><input id="s-rev-folder">
        <div class="hint" data-i18n="s_rev_hint"></div></div>
    </div>
    <h3 data-i18n="s_cols_h"></h3>
    <div class="muted" style="margin-bottom:6px" data-i18n="s_cols_hint"></div>
    <div class="grid2">
      <div class="field"><label data-i18n="s_c_item"></label><input id="s-c-item"></div>
      <div class="field"><label data-i18n="s_c_code"></label><input id="s-c-code"></div>
      <div class="field"><label data-i18n="s_c_desc"></label><input id="s-c-desc"></div>
      <div class="field"><label data-i18n="s_c_qty"></label><input id="s-c-qty"></div>
      <div class="field" style="grid-column: span 2"><label data-i18n="s_hidden"></label><input id="s-hidden" data-i18n-ph="s_hidden_ph"></div>
      <div class="field" style="grid-column: span 2"><label data-i18n="s_parts_cols"></label><input id="s-parts-cols" data-i18n-ph="s_parts_cols_ph">
        <div class="hint" data-i18n="s_parts_cols_hint"></div></div>
    </div>
    <h3 data-i18n="s_ft_h"></h3>
    <div class="muted" style="margin-bottom:6px" data-i18n="s_ft_hint"></div>
    <table class="ft-table">
      <thead><tr><th style="width:14%" data-i18n="ft_name"></th><th style="width:16%" data-i18n="ft_ext"></th><th data-i18n="ft_folders"></th><th style="width:12%" data-i18n="ft_match"></th><th style="width:6%" data-i18n="ft_list" data-i18n-title="ft_list_hint"></th><th style="width:4%"></th></tr></thead>
      <tbody id="ft-body"></tbody>
    </table>
    <button onclick="addFileTypeRow({name:'',extensions:[],folders:[],match:'exact',list:false})" data-i18n="ft_add"></button>
    <div class="modal-actions">
      <button onclick="restoreDefaults()" style="margin-right:auto" data-i18n="restore"></button>
      <button onclick="closeModal('settings')" data-i18n="cancel"></button>
      <button class="primary" id="btn-save" onclick="saveSettings()" data-i18n="save"></button>
    </div>
  </div>
</div>

<!-- Revisions: pending list and export -->
<div class="modal-bg" id="revpanel">
  <div class="modal" style="width:680px">
    <h2 data-i18n="rev_pending"></h2>
    <div id="revpanel-body"></div>
    <div class="modal-actions">
      <button id="btn-export" onclick="exportRevisions()" style="margin-right:auto" data-i18n="rev_export"></button>
      <button onclick="closeModal('revpanel')" data-i18n="close"></button>
    </div>
  </div>
</div>

<!-- Revisions: history of one item or product -->
<div class="modal-bg" id="revhist">
  <div class="modal" style="width:680px">
    <h2 id="revhist-title"></h2>
    <div id="revhist-body"></div>
    <div class="modal-actions"><button onclick="closeModal('revhist')" data-i18n="close"></button></div>
  </div>
</div>

<!-- Revisions: new request -->
<div class="modal-bg" id="revnew">
  <div class="modal" style="width:560px">
    <h2 id="revnew-title"></h2>
    <div class="field"><label data-i18n="rev_requester"></label><input id="rv-who"></div>
    <div class="field" style="margin-top:8px"><label data-i18n="rev_type"></label>
      <select id="rv-kind" style="width:100%" onchange="revKindChanged()"></select></div>
    <div class="field" style="margin-top:8px"><label id="rv-note-label"></label><textarea id="rv-note" rows="3"></textarea></div>
    <div class="field" style="margin-top:8px"><label data-i18n="rev_assignee"></label><input id="rv-to"></div>
    <div class="modal-actions">
      <button onclick="closeModal('revnew')" data-i18n="cancel"></button>
      <button class="primary" onclick="submitRevision()" data-i18n="rev_send"></button>
    </div>
  </div>
</div>

<!-- Revisions: close one -->
<div class="modal-bg" id="revclose">
  <div class="modal" style="width:560px">
    <h2 id="revclose-title"></h2>
    <div id="revclose-body"></div>
    <div class="field" style="margin-top:8px"><label data-i18n="rev_answer"></label><textarea id="rc-answer" rows="3"></textarea></div>
    <div class="field" style="margin-top:8px"><label data-i18n="rev_closed_by"></label><input id="rc-by"></div>
    <div class="modal-actions">
      <button onclick="closeModal('revclose')" data-i18n="cancel"></button>
      <button class="primary" onclick="submitClose()" data-i18n="rev_close"></button>
    </div>
  </div>
</div>

<!-- About -->
<div class="modal-bg" id="about">
  <div class="modal" style="width:520px">
    <h2>EngTree Viewer <span id="ab-ver" class="muted"></span></h2>
    <p data-i18n="ab_desc"></p>
    <p class="muted" data-i18n="ab_free"></p>
    <p><b data-i18n="ab_privacy_h"></b> <span data-i18n="ab_privacy"></span></p>
    <p class="muted"><span data-i18n="ab_cfg"></span> <span id="ab-cfg" class="pick"></span></p>
    <p><a onclick="openRepo('')" data-i18n="ab_page"></a> · <a onclick="openRepo('/issues/new')" data-i18n="ab_report"></a></p>
    <div class="modal-actions"><button onclick="closeModal('about')" data-i18n="close"></button></div>
  </div>
</div>

<div id="toast" style="position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#10b981; color:#fff; padding:8px 16px; border-radius:6px; display:none; z-index:200"></div>

<script>
// ---------- languages ----------
const I18N = {
  en: {
    mode: 'Mode', mode_production: 'Production', mode_engineering: 'Engineering',
    mode_hint: 'The mode belongs to this computer. Production can ask for revisions; engineering also closes them.',
    revisions: 'Revisions', rev_pending: 'Pending revisions', rev_pending_n: 'Revisions ({0})',
    rev_none: 'No open revisions.', rev_off: 'Revisions are off: no revisions folder set in Settings.',
    rev_offline: 'Revisions folder not reachable. Asking for a revision is unavailable until the network is back.',
    rev_request: 'Request a revision…', rev_request_for: 'Request a revision — {0}',
    rev_requester: 'Your name', rev_type: 'What is wrong', rev_note: 'Details', rev_note_opt: 'Details (optional)',
    rev_assignee: 'Assign to (optional)', rev_send: 'Send request', rev_sent: 'Request sent.',
    rev_kind_measure: 'Wrong measurement', rev_kind_missing_info: 'Missing dimension or information',
    rev_kind_material: 'Material or finish', rev_kind_file: 'Wrong or missing file', rev_kind_other: 'Other',
    rev_history: 'Revision history…', rev_history_for: 'Revisions — {0}', rev_history_none: 'No revisions for this item.',
    rev_close: 'Close revision…', rev_close_for: 'Close revision — {0}', rev_answer: 'Answer (short)',
    rev_closed_by: 'Closed by', rev_export: 'Export revisions', rev_whole_product: 'Whole product',
    rev_status_open: 'Open', rev_status_updated: 'Settled (file replaced)', rev_status_closed: 'Settled',
    rev_asked_by: '{0} · {1}', rev_assigned: 'for {0}',
    legend: 'Colours:', legend_rev: 'open revision', legend_gone: 'files deleted or moved',
    ctx_open: 'Open', ctx_copy_code: 'Copy code', ctx_copy_desc: 'Copy description',
    ctx_copy_both: 'Copy code and description', ctx_open_file: 'Open file', ctx_show_folder: 'Show in folder',
    ctx_zip_type: 'ZIP of every {0}', ctx_zip_item: "ZIP of this item's files", ctx_restore_cols: 'Restore columns',
    copied: 'Copied.', no_file_for: 'No file found for {0}.',
    s_mode_h: 'This computer', s_shared: 'Shared settings file (optional)',
    s_shared_hint: 'An engtree.json on the network with the settings below. Engineering sets the folders once and every computer follows.',
    s_shared_locked: 'These settings come from the shared file and are changed on an engineering computer.',
    s_shared_offline: 'Shared settings file not reachable: using the last copy read.',
    s_products_folder: 'Folder of products without a BOM (optional)',
    s_products_hint: 'Files here become products with their files but no tree, when no BOM has that code.',
    s_rev_folder: 'Revisions folder (optional)',
    s_rev_hint: 'The only folder EngTree writes to: one small file per revision request, shared by every computer.',
    offline_bar: '⚠ BOM folder not reachable (network or VPN down?). The product list shows the last saved data.',
    products: 'Products', refresh: 'Refresh', settings: 'Settings', about: 'About',
    search_ph: 'Search by code or description…',
    col_code: 'Code', col_desc: 'Description', col_date: 'BOM date', col_item: 'Item', col_qty: 'Qty', col_files: 'Files',
    welcome: 'Welcome! Start by telling EngTree where your BOM spreadsheets and drawings are.',
    open_settings: 'Open settings',
    reading: 'Reading the BOM folder…',

let lang = 'en';
function t(key, ...args) {
  const s = (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
  return s.replace(/\{(\d)\}/g, (_, i) => args[i] ?? '');
}
function pickLang(setting) {
  if (I18N[setting]) return setting;
  return (navigator.language || 'en').toLowerCase().startsWith('pt') ? 'pt-BR' : 'en';
}
function applyI18n(root) {
  root.querySelectorAll('[data-i18n]').forEach(e => e.textContent = t(e.dataset.i18n));
  root.querySelectorAll('[data-i18n-ph]').forEach(e => e.placeholder = t(e.dataset.i18nPh));
  root.querySelectorAll('[data-i18n-title]').forEach(e => e.title = t(e.dataset.i18nTitle));
}

// ---------- helpers ----------
function esc(v) { return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function debounce(fn, ms) { return () => { clearTimeout(fn._t); fn._t = setTimeout(fn, ms); }; }
function fmtDate(s) { if (!s) return ''; const d = new Date(s * 1000); return d.toLocaleDateString(lang) + ' ' + d.toLocaleTimeString(lang, {hour:'2-digit', minute:'2-digit'}); }
function fmtWhen(iso) { if (!iso) return ''; const d = new Date(iso); return d.toLocaleDateString(lang) + ' ' + d.toLocaleTimeString(lang, {hour:'2-digit', minute:'2-digit'}); }
function fmtSize(n) { return n > 1048576 ? (n/1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n/1024)) + ' KB'; }
function fileUrl(p, dl) { return '/api/file?path=' + encodeURIComponent(p) + (dl ? '&download=1' : ''); }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }
function showModal(id) { document.getElementById(id).style.display = 'flex'; }
function hasOpenRev(code) { return !!openCodes[String(code || '').toUpperCase()]; }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.display = 'block';
  clearTimeout(toast._t); toast._t = setTimeout(() => el.style.display = 'none', 2200);
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) {}
    ta.remove();
  }
  toast(t('copied'));
}

// ---------- columns: order and width, saved per list ----------
function colsFor(listKey, cols) {
  const order = (LAYOUT[listKey] || {}).order;
  if (!order || !order.length) return cols;
  const at = k => { const i = order.indexOf(k); return i < 0 ? 999 : i; };
  return cols.map((c, i) => [c, i]).sort((a, b) => (at(a[0].key) - at(b[0].key)) || (a[1] - b[1])).map(x => x[0]);
}
function widthFor(listKey, c) {
  const w = ((LAYOUT[listKey] || {}).widths || {})[c.key];
  return w || c.w || 140;
}
function gridHtml(listKey, cols, rows, cellFn, rowAttrFn, sortKey, asc) {
  cols = colsFor(listKey, cols);
  const cg = cols.map(c => `<col style="width:${widthFor(listKey, c)}px">`).join('');
  const th = cols.map(c => `<th draggable="true" data-k="${esc(c.key)}"${c.sort ? ` class="sortable" data-sort="${esc(c.sort)}"` : ''}>` +
    esc(c.label) + (c.sort && c.sort === sortKey ? (asc ? ' ▲' : ' ▼') : '') + `<div class="rz"></div></th>`).join('');
  const body = rows.map((r, i) => `<tr ${rowAttrFn(r, i)}>` + cols.map(c => `<td>${cellFn(r, c.key)}</td>`).join('') + '</tr>').join('');
  return `<table class="grid" data-list="${esc(listKey)}"><colgroup>${cg}</colgroup>` +
    `<thead><tr>${th}</tr></thead><tbody>${body || ''}</tbody></table>`;
}
function emptyRow(cols, text) {
  return `<tr class="msg"><td colspan="${cols}" class="empty" style="white-space:normal">${text}</td></tr>`;
}

async function saveLayout(listKey) {
  await fetch('/api/column_layout', { method: 'POST', body: JSON.stringify({ [listKey]: LAYOUT[listKey] || {} }) });
}
function redrawList(listKey) {
  if (listKey === 'products') loadProducts();
  else if (listKey === 'parts') loadParts();
  else Object.keys(openTabs).forEach(renderTree);
}
async function restoreColumns(listKey) {
  delete LAYOUT[listKey];
  await fetch('/api/column_layout', { method: 'POST', body: JSON.stringify({ [listKey]: {} }) });
  redrawList(listKey);
}

// Dragging the edge of a header resizes; dragging the header moves it.
document.addEventListener('mousedown', e => {
  const rz = e.target.closest('.rz');
  if (!rz) return;
  e.preventDefault();
  const th = rz.parentElement, table = th.closest('table.grid');
  const listKey = table.dataset.list, idx = [...th.parentElement.children].indexOf(th);
  const col = table.querySelectorAll('colgroup col')[idx];
  const startX = e.clientX, startW = th.offsetWidth;
  document.body.style.pointerEvents = 'none';
  const move = ev => { col.style.width = Math.max(50, startW + ev.clientX - startX) + 'px'; };
  const up = () => {
    document.body.style.pointerEvents = '';
    window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up);
    LAYOUT[listKey] = LAYOUT[listKey] || {};
    LAYOUT[listKey].widths = LAYOUT[listKey].widths || {};
    LAYOUT[listKey].widths[th.dataset.k] = parseInt(col.style.width, 10);
    saveLayout(listKey);
  };
  window.addEventListener('mousemove', move); window.addEventListener('mouseup', up);
});

let dragTh = null;
document.addEventListener('dragstart', e => {
  const th = e.target.closest && e.target.closest('th[data-k]');
  if (!th) return;
  dragTh = th; th.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', th.dataset.k); } catch (err) {}
});
document.addEventListener('dragover', e => {
  const th = e.target.closest && e.target.closest('th[data-k]');
  if (!th || !dragTh || th.closest('table') !== dragTh.closest('table')) return;
  e.preventDefault();
  document.querySelectorAll('th.dropzone').forEach(x => x.classList.remove('dropzone'));
  th.classList.add('dropzone');
});
document.addEventListener('drop', e => {
  const th = e.target.closest && e.target.closest('th[data-k]');
  document.querySelectorAll('th.dropzone').forEach(x => x.classList.remove('dropzone'));
  if (!th || !dragTh || th === dragTh || th.closest('table') !== dragTh.closest('table')) return;
  e.preventDefault();
  const table = th.closest('table.grid'), listKey = table.dataset.list;
  const keys = [...table.querySelectorAll('thead th')].map(x => x.dataset.k);
  const from = keys.indexOf(dragTh.dataset.k);
  keys.splice(from, 1);
  keys.splice(keys.indexOf(th.dataset.k) + (from < keys.indexOf(th.dataset.k) ? 1 : 0), 0, dragTh.dataset.k);
  LAYOUT[listKey] = LAYOUT[listKey] || {};
  LAYOUT[listKey].order = keys;
  saveLayout(listKey).then(() => redrawList(listKey));
});
document.addEventListener('dragend', () => {
  if (dragTh) dragTh.classList.remove('dragging');
  dragTh = null;
  document.querySelectorAll('th.dropzone').forEach(x => x.classList.remove('dropzone'));
});
document.addEventListener('click', e => {
  const th = e.target.closest && e.target.closest('th[data-sort]');
  if (!th || e.target.closest('.rz')) return;
  const listKey = th.closest('table.grid').dataset.list;
  if (listKey === 'products') sortBy(th.dataset.sort);
  else if (listKey === 'parts') sortParts(th.dataset.sort);
});
