let ctxAt = 0;
function hideCtx() { document.querySelectorAll('.ctx').forEach(m => m.remove()); }
document.addEventListener('click', hideCtx);
// Selecting a row scrolls it into view right after the menu opens, so a
// scroll in the first moments is not the user scrolling away.
document.addEventListener('scroll', () => { if (Date.now() - ctxAt > 400) hideCtx(); }, true);
// Not on window blur: opening a PDF next to the list steals focus for a
// moment and would close the menu the user just asked for.
document.addEventListener('mousedown', e => { if (!e.target.closest('.ctx')) hideCtx(); });

function ctxMenu(ev, items) {
  ev.preventDefault();
  hideCtx();
  const m = document.createElement('div');
  m.className = 'ctx';
  items.forEach((it, i) => {
    if (it.sep) { m.appendChild(document.createElement('hr')); return; }
    const d = document.createElement('div');
    d.className = it.group ? 'grp' : 'it' + (it.disabled ? ' dis' : '');
    d.textContent = it.label;
    if (!it.group && !it.disabled) d.onclick = ev2 => { ev2.stopPropagation(); hideCtx(); it.act(); };
    m.appendChild(d);
  });
  document.body.appendChild(m);
  ctxAt = Date.now();
  const w = m.offsetWidth, h = m.offsetHeight;
  m.style.left = Math.min(ev.clientX, innerWidth - w - 6) + 'px';
  m.style.top = Math.max(4, Math.min(ev.clientY, innerHeight - h - 6)) + 'px';
}

// Menu of a product, part or BOM line. files: the types it has, if known.
function rowMenu(ev, item) {
  const code = item.code || '', desc = item.desc || '';
  const items = [];
  if (item.openable !== false) items.push({ label: t('ctx_open'), act: () => openProduct(code) });
  items.push({ sep: true });
  items.push({ label: t('ctx_copy_code'), act: () => copyText(code) });
  if (desc) items.push({ label: t('ctx_copy_desc'), act: () => copyText(desc) });
  if (desc) items.push({ label: t('ctx_copy_both'), act: () => copyText(code + ' - ' + desc) });
  items.push({ sep: true });
  items.push({ label: t('ctx_open_file'), act: () => firstFile(code, f => fetch('/api/open_external?path=' + encodeURIComponent(f.path), { method: 'POST' })) });
  items.push({ label: t('ctx_show_folder'), act: () => firstFile(code, f => fetch('/api/open_folder?path=' + encodeURIComponent(f.path), { method: 'POST' })) });
  if (item.product) {
    (item.files || []).filter(x => x !== '📎').forEach(ty =>
      items.push({ label: t('ctx_zip_type', ty), act: () => zipOf(code, ty) }));
  } else {
    items.push({ label: t('ctx_zip_item'), act: () => firstType(code, ty => location.href = `/api/item_zip?code=${encodeURIComponent(code)}&type=${encodeURIComponent(ty)}`) });
  }
  if (rev.enabled) {
    items.push({ sep: true });
    items.push({ label: t('rev_request'), disabled: !rev.online, act: () => openRevNew(code, desc, item.inProduct || code) });
    items.push({ label: t('rev_history'), act: () => openRevHistory(code, item.product ? 'product' : 'item', desc) });
    if (rev.engineering) items.push({ label: t('rev_close'), disabled: !hasOpenRev(code) || !rev.online, act: () => openRevClose(code) });
  }
  ctxMenu(ev, items);
}

async function itemFiles(code) {
  try { return await (await fetch('/api/item_files?code=' + encodeURIComponent(code))).json(); } catch (e) { return []; }
}
async function firstFile(code, fn) {
  const types = await itemFiles(code);
  const ty = types.find(x => x.files.length);
  if (!ty) { toast(t('no_file_for', code)); return; }
  fn(ty.files[0]);
}
async function firstType(code, fn) {
  const types = await itemFiles(code);
  const ty = types.find(x => x.files.length);
  if (!ty) { toast(t('no_file_for', code)); return; }
  fn(ty.type);
}

// ---------- status ----------
let listCount = '', partsCount = '', scanText = '';
function showStatus() {
  document.getElementById('list-status').innerText = [listCount, scanText].filter(Boolean).join(' · ');
  document.getElementById('parts-status').innerText = [partsCount, scanText].filter(Boolean).join(' · ');
  document.getElementById('legend').innerHTML =
    `<span>${esc(t('legend'))}</span>` +
    (rev.enabled ? `<span><i class="dot" style="background:#ff7a7a"></i>${esc(t('legend_rev'))}</span>` : '') +
    `<span><i class="dot" style="background:#8a8f9e"></i>${esc(t('legend_gone'))}</span>`;
}

function showMode() {
  document.getElementById('mode-label').innerText = t('mode') + ': ' + t(rev.engineering ? 'mode_engineering' : 'mode_production');
  const btn = document.getElementById('rev-btn');
  btn.style.display = rev.enabled ? '' : 'none';
  const n = rev.open.length;
  btn.innerHTML = '⚑ ' + esc(n ? t('rev_pending_n', n) : t('revisions'));
  btn.style.color = n ? '#ff7a7a' : '';
}

async function pollStatus() {
  let s;
  try { s = await (await fetch('/api/status')).json(); } catch (e) { return; }
  configured = s.configured;
  document.getElementById('offline').style.display = (s.configured && !s.online) ? 'block' : 'none';
  const codesChanged = JSON.stringify(openCodes) !== JSON.stringify(s.open_codes || {});
  openCodes = s.open_codes || {};
  scanText = !s.scanning ? '' : (s.phase === 'indexing' ? t('indexing', s.progress) : t('reading'));
  if (!s.configured) {
    if (!document.getElementById('welcome')) {
      document.getElementById('products-wrap').innerHTML =
        `<div class="empty"><span id="welcome">${esc(t('welcome'))}</span><br><br>` +
        `<button class="primary" onclick="openSettings()">${esc(t('open_settings'))}</button></div>`;
      listCount = '';
    }
  } else if (s.rev !== pollStatus.rev || (!lastOnline && s.online)) {
    pollStatus.rev = s.rev;
    loadProducts();
    if (partsLoaded) { loadFacets().then(loadParts); }
  } else if (codesChanged) {
    loadProducts();
    if (partsLoaded) loadParts();
    Object.keys(openTabs).forEach(renderTree);
  }
  lastOnline = s.online;
  showStatus();
  await loadRevState(s.revisions);
  if (s.scanning) { clearTimeout(pollStatus.fast); pollStatus.fast = setTimeout(pollStatus, 1000); }
}

async function loadRevState(enabled) {
  if (!enabled) { rev = { enabled: false, online: false, engineering: rev.engineering, requester: '', open: [] }; showMode(); showStatus(); return; }
  try { rev = await (await fetch('/api/revisions/state')).json(); } catch (e) { return; }
  showMode();
  showStatus(); // the legend only shows the red colour where revisions are on
  // Engineering sees what is waiting for it as soon as the program opens.
  if (!alertShown && rev.engineering && rev.open.length) { alertShown = true; openRevPanel(); }
}

// ---------- products ----------
function productCols() {
  return [
    { key: 'code', label: t('col_code'), sort: 'code', w: 170 },
    { key: 'desc', label: t('col_desc'), sort: 'desc', w: 460 },
    { key: 'date', label: t('col_date'), sort: 'date', w: 160 },
    { key: 'files', label: t('col_files'), w: 220 },
  ];
}
function badgesHtml(files, refs) {
  return (files || []).filter(x => x !== '📎').map(x => `<button class="pbadge" data-zip="${esc(x)}" title="${esc(t('zip_product', x))}">${esc(x)}</button>`).join('') +
    (refs ? `<button class="pbadge clip" data-ref="1" title="${esc(t('attachments'))}">📎 ${refs === true ? '' : refs}</button>` : '');
}

function sortBy(col) {
  if (sortCol === col) sortAsc = !sortAsc; else { sortCol = col; sortAsc = true; }
  loadProducts();
}

async function loadProducts() {
  if (!configured) return;
  const q = document.getElementById('q').value;
  const seq = loadProducts.seq = (loadProducts.seq || 0) + 1;
  let list;
  try { list = await (await fetch(`/api/products?q=${encodeURIComponent(q)}&sort=${sortCol}&asc=${sortAsc ? 1 : 0}`)).json(); }
  catch (e) { return; }
  if (seq !== loadProducts.seq) return; // a newer search is already on its way
  productRows.length = 0;
  list.forEach(p => productRows.push(p));
  const cols = productCols();
  const cell = (p, k) => k === 'code' ? esc(p.code) : k === 'desc' ? esc(p.description)
    : k === 'date' ? fmtDate(p.mtime) : badgesHtml(p.files, p.refs);
  const attr = (p, i) => `data-code="${esc(p.code)}" data-i="${i}" class="${i === homeSel ? 'sel ' : ''}${hasOpenRev(p.code) ? 'rev' : ''}"`;
  const html = gridHtml('products', cols, list, cell, attr, sortCol, sortAsc);
  document.getElementById('products-wrap').innerHTML = list.length ? html
    : html.replace('<tbody></tbody>', `<tbody>${emptyRow(cols.length, esc(q ? t('no_match') : t('no_boms')))}</tbody>`);
  listCount = t('n_products', list.length);
  showStatus();
}

// ---------- parts and assemblies ----------
const partsState = { sort: 'code', asc: true, has: {}, onlyFiles: true, filters: {}, facets: { columns: [], types: [] } };
let partsLoaded = false;

async function loadFacets() {
  try { partsState.facets = await (await fetch('/api/parts_facets')).json(); } catch (e) { return; }
  const f = partsState.facets;
  let html = f.columns.map((c, i) => `<select data-f="${i}"><option value="">${esc(t('all_values', c.name))}</option>` +
    (c.values || []).map(v => `<option ${partsState.filters[i] === v ? 'selected' : ''}>${esc(v)}</option>`).join('') + `</select>`).join('');
  html += `<span class="muted">${esc(t('has'))}</span>` + f.types.map(x =>
    `<button data-has="${esc(x)}" class="${partsState.has[x] ? 'active' : ''}">${esc(x)}</button>`).join('');
  html += `<label class="chk"><input type="checkbox" id="only-files" ${partsState.onlyFiles ? 'checked' : ''}>${esc(t('only_files'))}</label>`;
  document.getElementById('parts-filters').innerHTML = html;
}
document.getElementById('parts-filters').addEventListener('click', e => {
  const b = e.target.closest('button[data-has]');
  if (!b) return;
  partsState.has[b.dataset.has] = !partsState.has[b.dataset.has];
  b.classList.toggle('active');
  loadParts();
});
document.getElementById('parts-filters').addEventListener('change', e => {
  if (e.target.id === 'only-files') partsState.onlyFiles = e.target.checked;
  else if (e.target.dataset.f !== undefined) partsState.filters[e.target.dataset.f] = e.target.value;
  loadParts();
});

function sortParts(col) {
  if (partsState.sort === col) partsState.asc = !partsState.asc; else { partsState.sort = col; partsState.asc = true; }
  loadParts();
}

async function loadParts() {
  const ps = partsState, cols = [
    { key: 'code', label: t('col_code'), sort: 'code', w: 170 },
    { key: 'desc', label: t('col_desc'), sort: 'desc', w: 300 },
    ...ps.facets.columns.map(c => ({ key: 'c:' + c.name, label: c.name, w: 140 })),
    { key: 'used', label: t('col_used'), w: 240 },
    { key: 'date', label: t('col_date2'), sort: 'date', w: 150 },
    { key: 'files', label: t('col_files'), w: 180 },
  ];
  const p = new URLSearchParams({ q: document.getElementById('pq').value, sort: ps.sort, asc: ps.asc ? 1 : 0,
    has: Object.keys(ps.has).filter(k => ps.has[k]).join(','), withfiles: ps.onlyFiles ? 1 : 0 });
  Object.entries(ps.filters).forEach(([i, v]) => { if (v) p.set('f' + i, v); });
  const seq = loadParts.seq = (loadParts.seq || 0) + 1;
  let d;
  try { d = await (await fetch('/api/parts?' + p)).json(); } catch (e) { return; }
  if (seq !== loadParts.seq) return;
  partRows.length = 0;
  d.rows.forEach(r => partRows.push(r));
  const cell = (r, k) => {
    if (k === 'code') return (r.assembly ? '▸ ' : '') + esc(r.code);
    if (k === 'desc') return esc(r.desc);
    if (k === 'used') { const u = r.used || []; return esc(u.length > 3 ? u.slice(0, 3).join(', ') + ` +${u.length - 3}` : u.join(', ')); }
    if (k === 'date') return fmtDate(r.mtime);
    if (k === 'files') return (r.files || []).map(x => x === '📎'
      ? `<button class="pbadge clip" data-ref="1" title="${esc(t('attachments'))}">📎</button>`
      : `<button class="pbadge" data-type="${esc(x)}">${esc(x)}</button>`).join('');
    const i = ps.facets.columns.findIndex(c => 'c:' + c.name === k);
    return esc((r.vals || [])[i]);
  };
  const attr = (r, i) => `data-code="${esc(r.code)}" data-i="${i}" title="${esc((r.used || []).join(', '))}" ` +
    `class="${i === partsSel ? 'sel ' : ''}${hasOpenRev(r.code) ? 'rev ' : ''}${r.missing ? 'gone' : ''}"`;
  const html = gridHtml('parts', cols, d.rows, cell, attr, ps.sort, ps.asc);
  document.getElementById('parts-wrap').innerHTML = d.rows.length ? html
    : html.replace('<tbody></tbody>', `<tbody>${emptyRow(cols.length, esc(t('parts_empty')))}</tbody>`);
  partsCount = d.total > d.rows.length ? t('n_parts_cut', d.total, d.rows.length) : t('n_parts', d.total);
  showStatus();
}

// ---------- clicks in both lists ----------
async function zipOf(code, type) {
  const url = `/api/package_zip?code=${encodeURIComponent(code)}&type=${encodeURIComponent(type)}`;
  const r = await fetch(url, { method: 'HEAD' });
  if (!r.ok) { alert(r.status === 503 ? t('zip_offline') : t('zip_none', type)); return; }
  location.href = url;
}
function wireList(wrapId, isProducts) {
  const wrap = document.getElementById(wrapId);
  // Selecting on mousedown, like a file list: dragging from a row selects
  // that row instead of starting a text selection.
  wrap.addEventListener('mousedown', e => {
    const tr = e.target.closest('tr[data-code]');
    if (tr) selectListRow(isProducts, +tr.dataset.i);
  });
  wrap.addEventListener('click', e => {
    const tr = e.target.closest('tr[data-code]');
    if (!tr) return;
    const b = e.target.closest('button');
    if (b && b.dataset.zip) zipOf(tr.dataset.code, b.dataset.zip);
    else if (b && b.dataset.ref) openProduct(tr.dataset.code, '📎');
    else if (b && b.dataset.type) openProduct(tr.dataset.code, b.dataset.type);
  });
  wrap.addEventListener('dblclick', e => {
    const tr = e.target.closest('tr[data-code]');
    if (tr && !e.target.closest('button')) openProduct(tr.dataset.code);
  });
  wrap.addEventListener('contextmenu', e => {
    const th = e.target.closest('th[data-k]');
    if (th) { ctxMenu(e, [{ label: t('ctx_restore_cols'), act: () => restoreColumns(isProducts ? 'products' : 'parts') }]); return; }
    const tr = e.target.closest('tr[data-code]');
    if (!tr) return;
    selectListRow(isProducts, +tr.dataset.i);
    const row = (isProducts ? productRows : partRows)[+tr.dataset.i] || {};
    rowMenu(e, { code: tr.dataset.code, desc: row.description || row.desc || '', product: isProducts, files: row.files || [] });
  });
}
function scrollRowIntoView(tr) {
  const wrap = tr.closest('.table-wrap');
  if (!wrap) return;
  const a = tr.getBoundingClientRect(), b = wrap.getBoundingClientRect();
  if (a.top < b.top) wrap.scrollTop -= b.top - a.top;
  else if (a.bottom > b.bottom) wrap.scrollTop += a.bottom - b.bottom;
}

function selectListRow(isProducts, i) {
  const wrap = document.getElementById(isProducts ? 'products-wrap' : 'parts-wrap');
  wrap.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel'));
  const tr = wrap.querySelector(`tr[data-i="${i}"]`);
  if (tr) { tr.classList.add('sel'); scrollRowIntoView(tr); }
  if (isProducts) homeSel = i; else partsSel = i;
}
function moveListSel(isProducts, step) {
  const rows = isProducts ? productRows : partRows;
  if (!rows.length) return;
  let i = (isProducts ? homeSel : partsSel) + step;
  i = Math.max(0, Math.min(rows.length - 1, i < 0 ? 0 : i));
  selectListRow(isProducts, i);
}
wireList('products-wrap', true);
wireList('parts-wrap', false);

document.getElementById('q').addEventListener('keydown', listKeys);
document.getElementById('pq').addEventListener('keydown', listKeys);
function listKeys(e) {
  const isProducts = e.target.id === 'q';
  const rows = isProducts ? productRows : partRows;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    moveListSel(isProducts, e.key === 'ArrowDown' ? 1 : -1);
  } else if (e.key === 'Enter') {
    const i = isProducts ? homeSel : partsSel;
    if (rows[i]) openProduct(rows[i].code);
    else if (rows.length === 1) openProduct(rows[0].code);
  }
}

async function refreshList() {
  await fetch('/api/refresh');
  setTimeout(pollStatus, 300);
}

// ---------- tabs ----------
function activateTab(id) {
  if (id === 'parts' && !partsLoaded) { partsLoaded = true; loadFacets().then(loadParts); }
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.id === 'tab-btn-' + id));
  document.querySelectorAll('.pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + id));
}

function closeTab(id, ev) {
  ev.stopPropagation();
  const st = openTabs[id];
  if (st && st.stageObserver) st.stageObserver.disconnect();
  if (st) delete tabOfCode[st.product.code.toUpperCase()];
  delete openTabs[id];
  document.getElementById('tab-btn-' + id).remove();
  document.getElementById('pane-' + id).remove();
  activateTab(st && st.from === 'parts' ? 'parts' : 'home');
}

// Opens a product (whole BOM) or a part/assembly (the part and its sub-tree).
// wantType: file type to show first (e.g. '📎' for the attachments).
async function openProduct(code, wantType) {
  const known = tabOfCode[code.toUpperCase()];
  if (known) {
    activateTab(known);
    if (wantType) { openTabs[known].typeName = wantType; selectRow(known, openTabs[known].sel); }
    return;
  }
  const from = document.getElementById('pane-parts').classList.contains('active') ? 'parts' : 'home';
  const r = await fetch('/api/product?code=' + encodeURIComponent(code));
  if (!r.ok) { alert(t('not_found')); return; }
  const d = await r.json();
  if (tabOfCode[code.toUpperCase()]) { activateTab(tabOfCode[code.toUpperCase()]); return; } // double double-click
  const id = 't' + (++tabSeq);
  tabOfCode[code.toUpperCase()] = id;

  // Flatten the tree, with the product itself as the top row.
  const rows = [];
  const root = { item: '', code: d.product.code, desc: d.product.description, qty: '', values: d.root_values || [],
    files: d.product_files || [], children: d.bom.tree, isRoot: true };
  (function flat(nodes, depth, parentKey) {
    nodes.forEach((n, i) => {
      const key = parentKey + '/' + i;
      rows.push({ node: n, depth, key, parentKey, hasKids: n.children && n.children.length > 0 });
      if (n.children) flat(n.children, depth + 1, key);
    });
  })([root], 0, '');

  openTabs[id] = {
    product: d.product, columns: d.bom.columns, rows, part: d.part,
    collapsed: {}, sel: 0, mode: null, typeName: wantType || null, typeFiles: [], fileIdx: 0, from,
    zoom: 1, panX: 0, panY: 0, rotX: -0.45, rotY: 0.65, measuring: false
  };

  const tab = document.createElement('div');
  tab.className = 'tab'; tab.id = 'tab-btn-' + id;
  tab.innerHTML = `${esc(d.product.code)} <span class="x" onclick="closeTab('${id}', event)">✕</span>`;
  tab.onclick = () => activateTab(id);
  document.getElementById('tabbar').appendChild(tab);

  const pane = document.createElement('div');
  pane.className = 'pane'; pane.id = 'pane-' + id;
  const warn = [...d.bom.warnings.map(w => t('warn_' + w)), ...(d.online ? [] : [t('tree_offline')])];
  pane.innerHTML = `
    <div class="split">
      <div class="left" id="left-${id}">
        <div class="row">
          <input class="grow" data-i18n-ph="filter_ph" oninput="filterTree('${id}', this.value)">
          <button onclick="expandAll('${id}', true)" data-i18n-title="expand_all">⊞</button>
          <button onclick="expandAll('${id}', false)" data-i18n-title="collapse_all">⊟</button>
        </div>
        ${warn.map(w => `<div class="warn">${esc(w)}</div>`).join('')}
        <div class="table-wrap" id="tree-${id}"></div>
        <div class="muted">${esc(t('n_lines', rows.length - 1))}</div>
      </div>
      <div class="divider" onmousedown="startResize(event, '${id}')"></div>
      <div class="right">
        <div class="bar" id="types-${id}"></div>
        <div class="bar" id="tools-${id}"></div>
        <div class="stage" id="stage-${id}"></div>
      </div>
    </div>`;
  applyI18n(pane);
  document.getElementById('workspace').appendChild(pane);
  document.getElementById('types-' + id).addEventListener('click', e => {
    const b = e.target.closest('button[data-type]');
    if (b && !b.disabled) pickType(id, b.dataset.type);
  });
  const treeEl = document.getElementById('tree-' + id);
  treeEl.addEventListener('contextmenu', e => {
    const th = e.target.closest('th[data-k]');
    if (th) { ctxMenu(e, [{ label: t('ctx_restore_cols'), act: () => restoreColumns('tree') }]); return; }
    const tr = e.target.closest('tr[data-i]');
    if (!tr) return;
    const st = openTabs[id], n = st.rows[+tr.dataset.i].node;
    selectRow(id, +tr.dataset.i);
    rowMenu(e, { code: n.code, desc: n.desc, product: !!n.isRoot && !st.part, inProduct: st.product.code,
      files: n.files || [], openable: !n.isRoot });
  });
  activateTab(id);
  renderTree(id);
  selectRow(id, 0);
}

// ---------- tree ----------
function isHidden(st, row) {
  let pk = row.parentKey;
  while (pk) {
    if (st.collapsed[pk]) return true;
    pk = pk.substring(0, pk.lastIndexOf('/'));
  }
  return false;
}

function renderTree(id) {
  const st = openTabs[id];
  if (!st) return;
  const cols = [
    { key: 'item', label: t('col_item'), w: 110 },
    { key: 'code', label: t('col_code'), w: 150 },
    { key: 'desc', label: t('col_desc'), w: 260 },
    { key: 'qty', label: t('col_qty'), w: 70 },
    { key: 'files', label: t('col_files'), w: 150 },
    ...st.columns.map(c => ({ key: 'c:' + c, label: c, w: 130 })),
  ];
  const f = (st.filter || '').toLowerCase();
  const visible = st.rows.map((r, i) => ({ r, i })).filter(x => !isHidden(st, x.r));
  const cell = (x, k) => {
    const n = x.r.node;
    if (k === 'item') {
      const tog = x.r.hasKids ? `<span class="toggle" onclick="toggleNode('${id}', '${x.r.key}', event)">${st.collapsed[x.r.key] ? '+' : '−'}</span>` : '<span class="toggle"></span>';
      return `<span style="padding-left:${x.r.depth * 16}px"></span>${tog}${esc(n.item)}`;
    }
    if (k === 'code') return esc(n.code);
    if (k === 'desc') return esc(n.desc);
    if (k === 'qty') return esc(n.qty);
    if (k === 'files') return (n.files || []).map(y => `<span class="badge">${esc(y)}</span>`).join('');
    const i = st.columns.indexOf(k.slice(2));
    return esc((n.values || [])[i]);
  };
  const attr = x => {
    const n = x.r.node;
    const match = !f || [n.code, n.desc, ...(n.values || [])].some(v => String(v || '').toLowerCase().includes(f));
    return `data-i="${x.i}" onmousedown="selectRow('${id}', ${x.i})" class="${[x.i === st.sel ? 'sel' : '', n.isRoot ? 'root' : '',
      match ? '' : 'dim', hasOpenRev(n.code) ? 'rev' : '', n.missing ? 'gone' : ''].filter(Boolean).join(' ')}"`;
  };
  document.getElementById('tree-' + id).innerHTML = gridHtml('tree', cols, visible, cell, attr);
}

function toggleNode(id, key, ev) {
  ev.stopPropagation();
  const st = openTabs[id];
  st.collapsed[key] = !st.collapsed[key];
  if (isHidden(st, st.rows[st.sel])) { renderTree(id); selectRow(id, st.rows.findIndex(r => r.key === key)); return; }
  renderTree(id);
}

function expandAll(id, open) {
  const st = openTabs[id];
  st.collapsed = {};
  if (!open) st.rows.forEach(r => { if (r.hasKids && r.depth > 0) st.collapsed[r.key] = true; });
  if (isHidden(st, st.rows[st.sel])) { renderTree(id); selectRow(id, 0); return; }
  renderTree(id);
}

function filterTree(id, text) {
  const st = openTabs[id];
  st.filter = text;
  if (text) st.collapsed = {};
  renderTree(id);
}

async function selectRow(id, idx) {
  const st = openTabs[id];
  if (!st || idx < 0) return;
  st.sel = idx;
  const wrap = document.getElementById('tree-' + id);
  wrap.querySelectorAll('tr.sel').forEach(x => x.classList.remove('sel'));
  const tr = wrap.querySelector(`tr[data-i="${idx}"]`);
  if (tr) { tr.classList.add('sel'); scrollRowIntoView(tr); }

  const code = st.rows[idx].node.code;
  let files = [];
  try { files = await (await fetch('/api/item_files?code=' + encodeURIComponent(code))).json(); } catch (e) {}
  if (openTabs[id] !== st || st.sel !== idx) return; // tab closed or user already moved on
  st.typeFiles = files;
  let cur = st.typeFiles.find(x => x.type === st.typeName && x.files.length);
  if (!cur) cur = st.typeFiles.find(x => x.files.length);
  if (cur) st.typeName = cur.type;
  st.fileIdx = 0; st.listPick = false;
  renderTypes(id);
  showFile(id);
}

function renderTypes(id) {
  const st = openTabs[id];
  const n = st.rows[st.sel].node;
  const cur = currentFile(st);
  let html = `<span class="title" title="${esc(n.code + ' ' + n.desc)}">${esc(n.code)} ${esc(n.desc)}</span>`;
  html += st.typeFiles.filter(x => !x.ref || x.files.length).map(x => `<button class="${cur && x.type === st.typeName ? 'active' : ''}" ${x.files.length ? '' : 'disabled'}
      data-type="${esc(x.type)}" ${x.ref ? `title="${esc(t('attachments'))}"` : ''}>${esc(x.type)}${x.files.length > 1 || (x.list && x.files.length) ? ' (' + x.files.length + ')' : ''}</button>`).join('');
  if (rev.enabled) {
    const open = hasOpenRev(n.code);
    html += `<span class="grow"></span><button onclick="openRevHistory('${esc(n.code)}', '${n.isRoot && !st.part ? 'product' : 'item'}', ${JSON.stringify(n.desc || '')})"
       style="${open ? 'color:#ff7a7a;border-color:#ff7a7a' : ''}">⚑ ${esc(open ? t('rev_status_open') : t('revisions'))}</button>`;
  }
  document.getElementById('types-' + id).innerHTML = html;
}

function pickType(id, type) {
  const st = openTabs[id];
  st.typeName = type; st.fileIdx = 0; st.listPick = false;
  renderTypes(id);
  showFile(id);
}

function currentFile(st) {
  const x = (st.typeFiles || []).find(y => y.type === st.typeName);
  return x && x.files.length ? { list: x.files, file: x.files[st.fileIdx] || x.files[0] } : null;
}
function curType(st) { return (st.typeFiles || []).find(y => y.type === st.typeName); }

function renderTools(id) {
  const st = openTabs[id];
  const cur = currentFile(st), ty = curType(st);
  const isList = st.mode === 'list';
  let html = '';
  if (isList) {
    html += `<span class="muted">${esc(t('n_files', cur.list.length))}</span>`;
  } else if (cur && ty && ty.list) {
    html += `<button onclick="backToList('${id}')">${esc(t('back_list'))}</button><span class="muted">${esc(cur.file.name)}</span>`;
  } else if (cur && cur.list.length > 1) {
    html += `<select onchange="openTabs['${id}'].fileIdx = +this.value; showFile('${id}')">` +
      cur.list.map((f, i) => `<option value="${i}" ${i === st.fileIdx ? 'selected' : ''}>${esc(f.name)} — ${fmtDate(f.mtime)}</option>`).join('') + `</select>`;
  } else if (cur) {
    html += `<span class="muted">${esc(cur.file.name)} · ${fmtDate(cur.file.mtime)} · ${fmtSize(cur.file.size)}</span>`;
  }
  if (st.mode === 'dxf' || st.mode === 'iges') {
    html += `<button onclick="zoomViewer('${id}', 1.25)">＋</button><button onclick="zoomViewer('${id}', 0.8)">－</button>
      <button onclick="resetViewer('${id}')">${esc(t('fit'))}</button>
      <button id="btn-meas-${id}" onclick="toggleMeasure('${id}')">📏 ${esc(t('measure'))}</button>
      <span class="meas" id="meas-info-${id}"></span>`;
  }
  html += `<span class="grow"></span>`;
  if (cur && !isList) {
    html += `<button onclick="openExternal('${id}')" title="${esc(t('open_default'))}">↗ ${esc(t('open'))}</button>
      <button onclick="openFolder('${id}')" title="${esc(t('show_folder'))}">📁</button>
      <button onclick="downloadCurrent('${id}')">⬇ ${esc(t('download'))}</button>`;
  }
  if (isList && cur.list.length > 1) {
    html += `<button onclick="downloadItemZip('${id}')" title="${esc(t('zip_item_title'))}">⬇ ${esc(t('zip_item', cur.list.length))}</button>`;
  }
  if (st.typeName && ty && !ty.ref && st.rows.length > 1) {
    html += `<button onclick="downloadZip('${id}')" title="${esc(t('zip_title', st.typeName))}">⬇ ${esc(t('zip_all', st.typeName))}</button>`;
  }
  document.getElementById('tools-' + id).innerHTML = html;
}

function fileIcon(f) {
  return { pdf: '📕', image: '🖼️', video: '🎬', audio: '🔊', text: '📃', dxf: '📐', iges: '🧊' }[f.viewer] ||
    (['.xlsx', '.xls', '.csv'].includes(f.ext) ? '📊' : ['.docx', '.doc'].includes(f.ext) ? '📝' : '📄');
}

function renderFileList(id) {
  const st = openTabs[id], cur = currentFile(st);
  document.getElementById('stage-' + id).innerHTML = `<div class="filelist"><table>
    <thead><tr><th>${esc(t('col_name'))}</th><th>${esc(t('col_date2'))}</th><th>${esc(t('col_size'))}</th><th></th></tr></thead><tbody>` +
    cur.list.map((f, i) => `<tr ondblclick="listAct('${id}', ${i}, '${f.viewer === 'external' ? 'open' : 'view'}')">
      <td class="name">${fileIcon(f)} ${esc(f.name)}</td><td>${fmtDate(f.mtime)}</td><td>${fmtSize(f.size)}</td>
      <td>${f.viewer === 'external' ? '' : `<button onclick="listAct('${id}', ${i}, 'view')">👁 ${esc(t('view'))}</button>`}<button onclick="listAct('${id}', ${i}, 'open')" title="${esc(t('open_default'))}">↗</button><button onclick="listAct('${id}', ${i}, 'folder')" title="${esc(t('show_folder'))}">📁</button><button onclick="listAct('${id}', ${i}, 'download')" title="${esc(t('download'))}">⬇</button></td></tr>`).join('') +
    `</tbody></table></div>`;
}

function listAct(id, i, act) {
  const st = openTabs[id];
  st.fileIdx = i;
  if (act === 'view') { st.listPick = true; showFile(id); }
  else if (act === 'open') openExternal(id);
  else if (act === 'folder') openFolder(id);
  else downloadCurrent(id);
}
function backToList(id) { openTabs[id].listPick = false; showFile(id); }
function downloadItemZip(id) {
  const st = openTabs[id];
  location.href = `/api/item_zip?code=${encodeURIComponent(st.rows[st.sel].node.code)}&type=${encodeURIComponent(st.typeName)}`;
}

async function showFile(id) {
  const st = openTabs[id];
  const stage = document.getElementById('stage-' + id);
  const cur = currentFile(st);
  const seq = st.showSeq = (st.showSeq || 0) + 1;
  const stale = () => openTabs[id] !== st || st.showSeq !== seq; // another file was picked meanwhile
  const ty = curType(st);
  st.mode = !cur ? null : (ty && ty.list && !st.listPick ? 'list' : cur.file.viewer);
  st.cadData = null; st.measuring = false; st.defaultDimText = '';
  st.pt1 = st.pt2 = st.selectedSeg = st.hoverPt = st.hoverSeg = null; st.measureText = '';
  renderTools(id);

  if (!cur) {
    const n = st.rows[st.sel].node;
    stage.innerHTML = `<div class="empty">${esc(t('no_files', n.code || t('no_code')))}<br>
      <span class="muted">${esc(t('no_files_hint'))}</span></div>`;
    return;
  }
  const f = cur.file;
  if (st.mode === 'list') {
    renderFileList(id);
  } else if (st.mode === 'video') {
    stage.innerHTML = `<video src="${esc(fileUrl(f.path))}" controls></video>`;
  } else if (st.mode === 'audio') {
    stage.innerHTML = `<audio src="${esc(fileUrl(f.path))}" controls></audio>`;
  } else if (st.mode === 'pdf') {
    stage.innerHTML = `<iframe src="${esc(fileUrl(f.path))}#view=Fit"></iframe>`;
  } else if (st.mode === 'image') {
    stage.innerHTML = `<img src="${esc(fileUrl(f.path))}" alt="">`;
  } else if (st.mode === 'text') {
    stage.innerHTML = '';
    // Decode as UTF-8 and fall back to Windows-1252 (common for CNC programs).
    const buf = await (await fetch(fileUrl(f.path))).arrayBuffer();
    if (stale()) return;
    let txt;
    try { txt = new TextDecoder('utf-8', { fatal: true }).decode(buf); }
    catch (e) { txt = new TextDecoder('windows-1252').decode(buf); }
    stage.innerHTML = `<pre>${esc(txt.length > 500000 ? txt.slice(0, 500000) + '\n…' : txt)}</pre>`;
  } else if (st.mode === 'dxf' || st.mode === 'iges') {
    stage.innerHTML = `<canvas class="cad-canvas" id="canvas-${id}"></canvas>`;
    watchStageResize(id);
    let d = null;
    try {
      const r = await fetch(`/api/cad_data?path=${encodeURIComponent(f.path)}&kind=${st.mode}`);
      if (r.ok) d = await r.json();
    } catch (e) {}
    if (stale()) return;
    st.cadData = d || { segments: [], faces: [] };
    st.zoom = 1; st.panX = 0; st.panY = 0;
    d = st.cadData;
    st.defaultDimText = st.mode === 'dxf'
      ? `${(d.width || 0).toFixed(1)} × ${(d.height || 0).toFixed(1)} mm`
      : `${(d.dx || 0).toFixed(1)} × ${(d.dy || 0).toFixed(1)} × ${(d.dz || 0).toFixed(1)} mm`;
    const mi = document.getElementById('meas-info-' + id);
    if (mi) mi.innerText = st.defaultDimText;
    setupCanvasInteractions(id);
    drawCadCanvas(id);
  } else {
    stage.innerHTML = `<div class="empty">${esc(t('no_viewer', f.ext))}<br><br>
      <button class="primary" onclick="openExternal('${id}')">${esc(t('open_default'))}</button></div>`;
  }
}

async function openExternal(id) {
  const cur = currentFile(openTabs[id]);
  if (cur) await fetch('/api/open_external?path=' + encodeURIComponent(cur.file.path), { method: 'POST' });
}
async function openFolder(id) {
  const cur = currentFile(openTabs[id]);
  if (cur) await fetch('/api/open_folder?path=' + encodeURIComponent(cur.file.path), { method: 'POST' });
}
function downloadCurrent(id) {
  const cur = currentFile(openTabs[id]);
  if (cur) location.href = fileUrl(cur.file.path, true);
}
function downloadZip(id) {
  const st = openTabs[id];
  zipOf(st.product.code, st.typeName);
}

function startResize(ev, id) {
  ev.preventDefault();
  const left = document.getElementById('left-' + id);
  const startX = ev.clientX, startW = left.offsetWidth;
  // The PDF iframe swallows mouse events, so switch them off while dragging.
  document.body.style.pointerEvents = 'none';
  const move = e => { left.style.width = Math.max(300, startW + e.clientX - startX) + 'px'; };
  const up = () => {
    document.body.style.pointerEvents = '';
    window.removeEventListener('mousemove', move); window.removeEventListener('mouseup', up);
  };
  window.addEventListener('mousemove', move);
  window.addEventListener('mouseup', up);
}

window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { hideCtx(); ['settings','about','revpanel','revhist','revnew','revclose'].forEach(closeModal); return; }
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
  if (document.querySelector('.modal-bg[style*="flex"]')) return;
  const active = document.querySelector('.tab.active');
  const id = active && active.id.replace('tab-btn-', '');
  if (id === 'home' || id === 'parts') {
    const isProducts = id === 'home';
    const rows = isProducts ? productRows : partRows;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); moveListSel(isProducts, e.key === 'ArrowDown' ? 1 : -1); }
    else if (e.key === 'Enter') { const i = isProducts ? homeSel : partsSel; if (rows[i]) openProduct(rows[i].code); }
    return;
  }
  const st = openTabs[id];
  if (!st || (e.key !== 'ArrowDown' && e.key !== 'ArrowUp')) return;
  e.preventDefault();
  const step = e.key === 'ArrowDown' ? 1 : -1;
  for (let i = st.sel + step; i >= 0 && i < st.rows.length; i += step) {
    if (!isHidden(st, st.rows[i])) { selectRow(id, i); break; }
  }
});

// ---------- CAD viewer (DXF 2D / IGES 3D) ----------
// ---------- CAD viewer (DXF 2D / IGES 3D) ----------
function zoomViewer(tabId, factor) {
  const st = openTabs[tabId];
  st.zoom *= factor;
  drawCadCanvas(tabId);
}

function resetViewer(tabId) {
  const st = openTabs[tabId];
  st.zoom = 1; st.panX = 0; st.panY = 0;
  st.rotX = -0.45; st.rotY = 0.65;
  clearMeasure(tabId);
}

function toggleMeasure(tabId) {
  const st = openTabs[tabId];
  st.measuring = !st.measuring;
  st.pt1 = null; st.pt2 = null; st.selectedSeg = null;
  document.getElementById(`btn-meas-${tabId}`).classList.toggle('active', st.measuring);
  document.getElementById('meas-info-' + tabId).innerText = st.measuring
    ? t('meas_on')
    : st.defaultDimText;
  drawCadCanvas(tabId);
}

function clearMeasure(tabId) {
  const st = openTabs[tabId];
  if (!st) return;
  st.pt1 = null; st.pt2 = null; st.selectedSeg = null;
  st.hoverPt = null; st.hoverSeg = null; st.measureText = '';
  const el = document.getElementById('meas-info-' + tabId);
  if (el) el.innerText = st.defaultDimText || '';
  drawCadCanvas(tabId);
}

function distToSegment2D(px, py, x1, y1, x2, y2) {
  const l2 = (x2 - x1)*(x2 - x1) + (y2 - y1)*(y2 - y1);
  if (l2 === 0) return Math.hypot(px - x1, py - y1);
  let t = ((px - x1)*(x2 - x1) + (py - y1)*(y2 - y1)) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1 + t*(x2 - x1)), py - (y1 + t*(y2 - y1)));
}

function setupCanvasInteractions(tabId) {
  const canvas = document.getElementById('canvas-' + tabId);
  if (!canvas) return;
  const st = openTabs[tabId];
  let dragging = false, lx = 0, ly = 0;

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    st.zoom *= (e.deltaY < 0 ? 1.15 : 0.87);
    drawCadCanvas(tabId);
  });

  canvas.addEventListener('mousedown', e => {
    if (st.measuring && e.button === 0) {
      if (st.hoverPt) {
        if (!st.pt1 || st.pt2) {
          st.pt1 = st.hoverPt;
          st.pt2 = null;
          st.selectedSeg = null;
          st.measureText = '';
          document.getElementById('meas-info-' + tabId).innerText =
            t('meas_p1', st.pt1.wx.toFixed(1), st.pt1.wy.toFixed(1));
          drawCadCanvas(tabId);
          return;
        } else {
          st.pt2 = st.hoverPt;
          const dx = Math.abs(st.pt2.wx - st.pt1.wx);
          const dy = Math.abs(st.pt2.wy - st.pt1.wy);
          const dz = Math.abs((st.pt2.wz||0) - (st.pt1.wz||0));
          const dist = Math.hypot(dx, dy, dz);
          st.measureText = `${dist.toFixed(2)} mm`;
          document.getElementById('meas-info-' + tabId).innerText =
            t('meas_dist') + ` ${dist.toFixed(2)} mm (ΔX=${dx.toFixed(2)}, ΔY=${dy.toFixed(2)}${st.mode==='iges'?`, ΔZ=${dz.toFixed(2)}`:''})`;
          drawCadCanvas(tabId);
          return;
        }
      }
      if (st.hoverSeg) {
        st.selectedSeg = st.hoverSeg;
        st.pt1 = {wx: st.hoverSeg.wx1, wy: st.hoverSeg.wy1, wz: st.hoverSeg.wz1};
        st.pt2 = {wx: st.hoverSeg.wx2, wy: st.hoverSeg.wy2, wz: st.hoverSeg.wz2};
        const dx = Math.abs(st.pt2.wx - st.pt1.wx);
        const dy = Math.abs(st.pt2.wy - st.pt1.wy);
        const dz = Math.abs(st.pt2.wz - st.pt1.wz);
        const dist = Math.hypot(dx, dy, dz);
        st.measureText = `${dist.toFixed(2)} mm`;
        document.getElementById('meas-info-' + tabId).innerText =
          t('meas_line') + ` ${dist.toFixed(2)} mm (ΔX=${dx.toFixed(2)}, ΔY=${dy.toFixed(2)}${st.mode==='iges'?`, ΔZ=${dz.toFixed(2)}`:''})`;
        drawCadCanvas(tabId);
        return;
      }
    }
    dragging = true; lx = e.clientX; ly = e.clientY;
    window.addEventListener('mouseup', () => dragging = false, { once: true });
  });

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;

    if (st.measuring && !dragging && st.screenPts) {
      let bestPt = null, bestPtD = 22;
      for (const p of st.screenPts) {
        const d = Math.hypot(p.sx - mx, p.sy - my);
        if (d < bestPtD) { bestPtD = d; bestPt = p; }
      }
      let bestSeg = null, bestSegD = 12;
      if (st.screenSegs) {
        for (const s of st.screenSegs) {
          const d = distToSegment2D(mx, my, s.sx1, s.sy1, s.sx2, s.sy2);
          if (d < bestSegD) { bestSegD = d; bestSeg = s; }
        }
      }
      st.hoverPt = bestPt;
      st.hoverSeg = bestSeg;
      st.mousePos = {x: mx, y: my};
      drawCadCanvas(tabId);
    }

    if (!dragging) return;
    const dx = e.clientX - lx, dy = e.clientY - ly;
    lx = e.clientX; ly = e.clientY;
    if (st.mode === 'iges' && e.buttons === 1 && !st.measuring) {
      st.rotY += dx * 0.01;
      st.rotX += dy * 0.01;
    } else {
      st.panX += dx;
      st.panY += dy;
    }
    drawCadCanvas(tabId);
  });

}

function watchStageResize(tabId) {
  const st = openTabs[tabId];
  const stage = document.getElementById('stage-' + tabId);
  if (!st || !stage || st.stageObserver) return;
  st.stageObserver = new ResizeObserver(() => {
    if (st.resizeFrame) cancelAnimationFrame(st.resizeFrame);
    st.resizeFrame = requestAnimationFrame(() => {
      if (st.mode === 'dxf' || st.mode === 'iges') drawCadCanvas(tabId);
    });
  });
  st.stageObserver.observe(stage);
}

function drawCadCanvas(tabId) {
  const canvas = document.getElementById('canvas-' + tabId);
  if (!canvas) return;
  if (!canvas.clientWidth || !canvas.clientHeight) return; // hidden tab: redrawn when shown
  const st = openTabs[tabId];
  const d = st.cadData;
  if (!d) return;
  if (!d.segments) d.segments = [];
  if (!d.faces) d.faces = [];
  if (!d.segments.length && !d.faces.length) {
    canvas.parentElement.innerHTML = `<div style="padding:30px; color:#9aa0b0;">${t('cad_fail', st.mode.toUpperCase())}</div>`;
    return;
  }

  canvas.width = canvas.clientWidth;
  canvas.height = canvas.clientHeight;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#191926';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  st.screenPts = [];
  st.screenSegs = [];

  let projPoint = null;

  if (st.mode === 'dxf') {
    const scale = Math.min((canvas.width - 50) / (d.width || 1), (canvas.height - 50) / (d.height || 1)) * st.zoom;
    const cx = (d.min_x + d.max_x) / 2, cy = (d.min_y + d.max_y) / 2;
    const ox = canvas.width / 2 + st.panX, oy = canvas.height / 2 + st.panY;

    projPoint = (wx, wy) => [ox + (wx - cx) * scale, oy - (wy - cy) * scale, 0];

    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    for (const s of d.segments) {
      const [sx1, sy1] = projPoint(s.x1, s.y1, 0);
      const [sx2, sy2] = projPoint(s.x2, s.y2, 0);
      ctx.moveTo(sx1, sy1);
      ctx.lineTo(sx2, sy2);
      st.screenPts.push({sx: sx1, sy: sy1, wx: s.x1, wy: s.y1, wz: 0});
      st.screenPts.push({sx: sx2, sy: sy2, wx: s.x2, wy: s.y2, wz: 0});
      st.screenSegs.push({sx1, sy1, sx2, sy2, wx1: s.x1, wy1: s.y1, wz1: 0, wx2: s.x2, wy2: s.y2, wz2: 0});
    }
    ctx.stroke();
  } else {
    const maxDim = Math.max(d.dx, d.dy, d.dz, 1);
    const scale = (Math.min(canvas.width, canvas.height) * 0.72 / maxDim) * st.zoom;
    const ox = canvas.width / 2 + st.panX, oy = canvas.height / 2 + st.panY;
    const cosX = Math.cos(st.rotX), sinX = Math.sin(st.rotX);
    const cosY = Math.cos(st.rotY), sinY = Math.sin(st.rotY);

    projPoint = (x, y, z) => {
      const x1 = x * cosY - z * sinY;
      const z1 = x * sinY + z * cosY;
      const y2 = y * cosX - z1 * sinX;
      const z2 = y * sinX + z1 * cosX;
      return [ox + x1 * scale, oy - y2 * scale, z2];
    };

    if (d.faces && d.faces.length > 0) {
      const projectedFaces = [];
      for (const f of d.faces) {
        const p1 = projPoint(f.x1, f.y1, f.z1);
        const p2 = projPoint(f.x2, f.y2, f.z2);
        const p3 = projPoint(f.x3, f.y3, f.z3);
        const ux = p2[0] - p1[0], uy = p2[1] - p1[1], uz = p2[2] - p1[2];
        const vx = p3[0] - p1[0], vy = p3[1] - p1[1], vz = p3[2] - p1[2];
        const nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
        const norm = Math.hypot(nx, ny, nz) || 1;
        const shade = Math.abs(nz / norm);
        projectedFaces.push({
          p1, p2, p3,
          zAvg: (p1[2] + p2[2] + p3[2]) / 3,
          shade
        });
      }
      projectedFaces.sort((a, b) => a.zAvg - b.zAvg);

      for (const pf of projectedFaces) {
        const r = Math.round(32 + pf.shade * 48);
        const g = Math.round(78 + pf.shade * 82);
        const b = Math.round(125 + pf.shade * 95);
        ctx.fillStyle = `rgba(${r}, ${g}, ${b}, 0.88)`;
        ctx.beginPath();
        ctx.moveTo(pf.p1[0], pf.p1[1]);
        ctx.lineTo(pf.p2[0], pf.p2[1]);
        ctx.lineTo(pf.p3[0], pf.p3[1]);
        ctx.closePath();
        ctx.fill();
      }
    }

    ctx.strokeStyle = (d.faces && d.faces.length > 0) ? '#bae6fd' : '#38bdf8';
    ctx.lineWidth = (d.faces && d.faces.length > 0) ? 1.15 : 1.4;
    ctx.beginPath();
    for (const s of d.segments) {
      const [sx1, sy1] = projPoint(s.x1, s.y1, s.z1);
      const [sx2, sy2] = projPoint(s.x2, s.y2, s.z2);
      ctx.moveTo(sx1, sy1);
      ctx.lineTo(sx2, sy2);
      st.screenPts.push({sx: sx1, sy: sy1, wx: s.x1, wy: s.y1, wz: s.z1});
      st.screenPts.push({sx: sx2, sy: sy2, wx: s.x2, wy: s.y2, wz: s.z2});
      st.screenSegs.push({sx1, sy1, sx2, sy2, wx1: s.x1, wy1: s.y1, wz1: s.z1, wx2: s.x2, wy2: s.y2, wz2: s.z2});
    }
    ctx.stroke();
  }

  if (st.measuring && projPoint) {
    if (st.hoverSeg) {
      ctx.strokeStyle = '#1dd15b';
      ctx.lineWidth = 3.2;
      ctx.beginPath();
      ctx.moveTo(st.hoverSeg.sx1, st.hoverSeg.sy1);
      ctx.lineTo(st.hoverSeg.sx2, st.hoverSeg.sy2);
      ctx.stroke();
    }
    if (st.hoverPt) {
      ctx.strokeStyle = '#1dd15b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(st.hoverPt.sx, st.hoverPt.sy, 7, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = '#1dd15b';
      ctx.beginPath();
      ctx.arc(st.hoverPt.sx, st.hoverPt.sy, 3, 0, Math.PI * 2);
      ctx.fill();
    }
    if (st.pt1 && !st.pt2) {
      const [p1x, p1y] = projPoint(st.pt1.wx, st.pt1.wy, st.pt1.wz || 0);
      const tx = st.hoverPt ? st.hoverPt.sx : (st.mousePos ? st.mousePos.x : p1x);
      const ty = st.hoverPt ? st.hoverPt.sy : (st.mousePos ? st.mousePos.y : p1y);

      ctx.save();
      ctx.strokeStyle = '#ffd166';
      ctx.lineWidth = 1.8;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(p1x, p1y);
      ctx.lineTo(tx, ty);
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = '#ff4757';
      ctx.beginPath();
      ctx.arc(p1x, p1y, 5.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (st.pt1 && st.pt2 && projPoint) {
    const [p1x, p1y] = projPoint(st.pt1.wx, st.pt1.wy, st.pt1.wz || 0);
    const [p2x, p2y] = projPoint(st.pt2.wx, st.pt2.wy, st.pt2.wz || 0);

    ctx.strokeStyle = '#ffd166';
    ctx.lineWidth = 3.0;
    ctx.beginPath();
    ctx.moveTo(p1x, p1y);
    ctx.lineTo(p2x, p2y);
    ctx.stroke();

    for (const [px, py] of [[p1x, p1y], [p2x, p2y]]) {
      ctx.fillStyle = '#ff4757';
      ctx.beginPath();
      ctx.arc(px, py, 5.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    if (st.measureText) {
      const mx = (p1x + p2x) / 2, my = (p1y + p2y) / 2;
      ctx.font = 'bold 12px "Segoe UI", sans-serif';
      const tw = ctx.measureText(st.measureText).width + 14;
      ctx.fillStyle = 'rgba(217, 119, 6, 0.95)';
      ctx.fillRect(mx - tw / 2, my - 22, tw, 20);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(st.measureText, mx, my - 12);
    }
  }
}

// ---------- revisions ----------
let revNewCtx = null;

function kindLabel(k) { return t('rev_kind_' + k); }
function statusLabel(s) { return t('rev_status_' + s); }

function revItemHtml(r, withClose) {
  const when = fmtWhen(r.created);
  const closed = r.closed_at ? `<div class="who">${esc(t('rev_closed_by'))}: ${esc(r.closed_by || '')} · ${esc(fmtWhen(r.closed_at))}${r.answer ? ' — ' + esc(r.answer) : ''}</div>` : '';
  return `<div class="rev-item ${esc(r.status)}">
    <b onclick="closeModal('revhist');closeModal('revpanel');openProduct('${esc(r.code)}')">${esc(r.code)}</b> ${esc(r.desc || '')}
    — <i>${esc(kindLabel(r.kind))}</i> · <b style="cursor:default">${esc(statusLabel(r.status))}</b>
    ${r.note ? `<div>${esc(r.note)}</div>` : ''}
    <div class="who">${esc(t('rev_asked_by', r.requester, when))}${r.product ? ' · ' + esc(r.product) : ''}${r.assignee ? ' · ' + esc(t('rev_assigned', r.assignee)) : ''}</div>
    ${closed}
    ${withClose && rev.engineering && r.status === 'open' ? `<div style="margin-top:6px"><button onclick="openRevClose('${esc(r.code)}', '${esc(r.id)}')">${esc(t('rev_close'))}</button></div>` : ''}
  </div>`;
}

function openRevPanel() {
  const body = document.getElementById('revpanel-body');
  if (!rev.enabled) body.innerHTML = `<div class="warnbox">${esc(t('rev_off'))}</div>`;
  else if (!rev.online) body.innerHTML = `<div class="warnbox">${esc(t('rev_offline'))}</div>`;
  else body.innerHTML = rev.open.length
    ? `<div class="rev-list">${rev.open.map(r => revItemHtml(r, true)).join('')}</div>`
    : `<p class="muted">${esc(t('rev_none'))}</p>`;
  document.getElementById('btn-export').style.display = rev.engineering ? '' : 'none';
  showModal('revpanel');
}

function exportRevisions() { location.href = '/api/revisions/export?lang=' + encodeURIComponent(lang); }

async function openRevHistory(code, scope, desc) {
  document.getElementById('revhist-title').innerText = t('rev_history_for', code + (desc ? ' ' + desc : ''));
  const body = document.getElementById('revhist-body');
  body.innerHTML = '…';
  showModal('revhist');
  let d;
  try { d = await (await fetch(`/api/revisions?code=${encodeURIComponent(code)}&scope=${scope}`)).json(); } catch (e) { return; }
  let html = '';
  if (!d.online) html += `<div class="warnbox">${esc(t('rev_offline'))}</div>`;
  if (scope === 'product') html += `<div class="muted">${esc(t('rev_whole_product'))}</div>`;
  html += d.rows.length ? `<div class="rev-list">${d.rows.map(r => revItemHtml(r, true)).join('')}</div>`
    : `<p class="muted">${esc(t('rev_history_none'))}</p>`;
  html += `<div style="margin-top:10px"><button class="primary" onclick="closeModal('revhist');openRevNew('${esc(code)}', ${JSON.stringify(desc || '')}, '${esc(code)}')" ${rev.online ? '' : 'disabled'}>${esc(t('rev_request'))}</button></div>`;
  body.innerHTML = html;
}

function openRevNew(code, desc, product) {
  revNewCtx = { code, desc: desc || '', product: product || code };
  document.getElementById('revnew-title').innerText = t('rev_request_for', code + (desc ? ' ' + desc : ''));
  document.getElementById('rv-who').value = rev.requester || '';
  const sel = document.getElementById('rv-kind');
  sel.innerHTML = REV_KINDS.map(k => `<option value="${k}">${esc(kindLabel(k))}</option>`).join('');
  sel.value = 'measure';
  document.getElementById('rv-note').value = '';
  document.getElementById('rv-to').value = '';
  revKindChanged();
  showModal('revnew');
  setTimeout(() => document.getElementById(rev.requester ? 'rv-note' : 'rv-who').focus(), 50);
}

function revKindChanged() {
  const other = document.getElementById('rv-kind').value === 'other';
  document.getElementById('rv-note-label').innerHTML = other
    ? esc(t('rev_note')) + ' <span class="req">*</span>' : esc(t('rev_note_opt'));
}

async function submitRevision() {
  const who = document.getElementById('rv-who').value.trim();
  const kind = document.getElementById('rv-kind').value;
  const note = document.getElementById('rv-note').value.trim();
  if (!who) { document.getElementById('rv-who').focus(); return; }
  if (kind === 'other' && !note) { document.getElementById('rv-note').focus(); return; }
  const r = await fetch('/api/revisions/new', { method: 'POST', body: JSON.stringify({
    code: revNewCtx.code, desc: revNewCtx.desc, product: revNewCtx.product,
    requester: who, kind, note, assignee: document.getElementById('rv-to').value.trim() }) });
  if (!r.ok) { alert(t('rev_offline')); return; }
  closeModal('revnew');
  toast(t('rev_sent'));
  pollStatus();
}

let revCloseList = [];
async function openRevClose(code, id) {
  closeModal('revhist'); closeModal('revpanel');
  document.getElementById('revclose-title').innerText = t('rev_close_for', code);
  document.getElementById('rc-answer').value = '';
  document.getElementById('rc-by').value = rev.requester || '';
  let d;
  try { d = await (await fetch(`/api/revisions?code=${encodeURIComponent(code)}&scope=item`)).json(); } catch (e) { return; }
  revCloseList = d.rows.filter(r => r.status === 'open');
  if (id) revCloseList = revCloseList.filter(r => r.id === id);
  if (!revCloseList.length) { toast(t('rev_none')); return; }
  document.getElementById('revclose-body').innerHTML = revCloseList.map(r =>
    `<div class="rev-item open">${esc(kindLabel(r.kind))}${r.note ? ' — ' + esc(r.note) : ''}
     <div class="who">${esc(t('rev_asked_by', r.requester, fmtWhen(r.created)))}</div></div>`).join('');
  showModal('revclose');
}

async function submitClose() {
  const answer = document.getElementById('rc-answer').value.trim();
  const by = document.getElementById('rc-by').value.trim();
  for (const r of revCloseList) {
    await fetch('/api/revisions/close', { method: 'POST', body: JSON.stringify({ ID: r.id, Answer: answer, By: by }) });
  }
  closeModal('revclose');
  pollStatus();
}

// ---------- settings ----------
function addFileTypeRow(ft) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td><input class="ft-name" value="${esc(ft.name)}" placeholder="PDF"></td>
    <td><input class="ft-ext" value="${esc((ft.extensions || []).join(', '))}" placeholder=".pdf"></td>
    <td><input class="ft-folders" value="${esc((ft.folders || []).join('; '))}" placeholder="\\\\server\\drawings"></td>
    <td><select class="ft-match"><option value="exact" ${ft.match === 'exact' ? 'selected' : ''}>${esc(t('ft_exact'))}</option><option value="prefix" ${ft.match !== 'exact' ? 'selected' : ''}>${esc(t('ft_prefix'))}</option></select></td>
    <td style="text-align:center"><input type="checkbox" class="ft-list" ${ft.list ? 'checked' : ''} title="${esc(t('ft_list_hint'))}"></td>
    <td><button onclick="this.closest('tr').remove()" title="${esc(t('ft_remove'))}">✕</button></td>`;
  document.getElementById('ft-body').appendChild(tr);
}

// Fields that come from the shared file, locked unless this computer may edit it.
const SHARED_FIELDS = ['s-bom-folder', 's-bom-prefix', 's-sep', 's-det-prefix', 's-det-file', 's-products-folder',
  's-ref-folder', 's-rev-folder', 's-c-item', 's-c-code', 's-c-desc', 's-c-qty', 's-hidden', 's-parts-cols'];

function fillSettings(c, shared) {
  const v = (id, val) => document.getElementById(id).value = val || '';
  v('s-lang', c.language); v('s-mode', c.mode || 'production'); v('s-shared', c.shared_config);
  v('s-bom-folder', c.bom_folder); v('s-bom-prefix', c.bom_prefix); v('s-sep', c.name_separator);
  v('s-det-prefix', c.details_prefix); v('s-det-file', c.details_file);
  v('s-products-folder', c.products_folder); v('s-ref-folder', c.ref_folder); v('s-rev-folder', c.revisions_folder);
  v('s-c-item', c.columns.item); v('s-c-code', c.columns.code); v('s-c-desc', c.columns.description); v('s-c-qty', c.columns.qty);
  v('s-hidden', (c.hidden_columns || []).join(', '));
  v('s-parts-cols', (c.parts_columns || []).join(', '));
  document.getElementById('ft-body').innerHTML = '';
  (c.file_types || []).forEach(addFileTypeRow);

  const locked = shared && shared.active && !shared.editable;
  SHARED_FIELDS.forEach(id => document.getElementById(id).disabled = locked);
  document.querySelectorAll('#ft-body input, #ft-body select, #ft-body button').forEach(el => el.disabled = locked);
  let note = '';
  if (shared && shared.offline) note += `<div class="warnbox">${esc(t('s_shared_offline'))}</div>`;
  if (locked) note += `<div class="warnbox">${esc(t('s_shared_locked'))}</div>`;
  document.getElementById('shared-note').innerHTML = note;
}

async function openSettings() {
  const d = await (await fetch('/api/config')).json();
  cfgCache = d.config;
  fillSettings(d.config, d.shared);
  showModal('settings');
}

async function restoreDefaults() {
  const d = await (await fetch('/api/default_config')).json();
  // Keep what is specific to this computer and this network.
  d.language = document.getElementById('s-lang').value;
  d.mode = document.getElementById('s-mode').value;
  d.shared_config = document.getElementById('s-shared').value;
  d.bom_folder = document.getElementById('s-bom-folder').value;
  d.products_folder = document.getElementById('s-products-folder').value;
  d.ref_folder = document.getElementById('s-ref-folder').value;
  d.revisions_folder = document.getElementById('s-rev-folder').value;
  const folders = {};
  document.querySelectorAll('#ft-body tr').forEach(tr => {
    folders[tr.querySelector('.ft-name').value.trim().toUpperCase()] = tr.querySelector('.ft-folders').value.split(';').map(x => x.trim()).filter(Boolean);
  });
  d.file_types.forEach(ft => { ft.folders = folders[ft.name.toUpperCase()] || []; });
  fillSettings(d, null);
}

async function saveSettings() {
  const g = id => document.getElementById(id).value;
  const split = (s, sep) => s.split(sep).map(x => x.trim()).filter(Boolean);
  const c = Object.assign({}, cfgCache, {
    language: g('s-lang'), mode: g('s-mode'), shared_config: g('s-shared').trim(),
    bom_folder: g('s-bom-folder').trim(), bom_prefix: g('s-bom-prefix'), name_separator: g('s-sep'),
    details_prefix: g('s-det-prefix'), details_file: g('s-det-file').trim(),
    products_folder: g('s-products-folder').trim(), ref_folder: g('s-ref-folder').trim(),
    revisions_folder: g('s-rev-folder').trim(),
    columns: { item: g('s-c-item'), code: g('s-c-code'), description: g('s-c-desc'), qty: g('s-c-qty') },
    hidden_columns: split(g('s-hidden'), ','),
    parts_columns: split(g('s-parts-cols'), ','),
    file_types: [...document.querySelectorAll('#ft-body tr')].map(tr => ({
      name: tr.querySelector('.ft-name').value.trim(),
      extensions: split(tr.querySelector('.ft-ext').value, ','),
      folders: split(tr.querySelector('.ft-folders').value, ';'),
      match: tr.querySelector('.ft-match').value,
      list: tr.querySelector('.ft-list').checked
    })).filter(f => f.name)
  });
  const r = await fetch('/api/config', { method: 'POST', body: JSON.stringify(c) });
  if (!r.ok) return;
  location.reload(); // the new language, columns and folders apply everywhere
}

// ---------- about ----------
let repoUrl = '';
async function openAbout() {
  const v = await (await fetch('/api/version')).json();
  repoUrl = v.repo;
  document.getElementById('ab-ver').innerText = `v${v.version} (${v.date})`;
  document.getElementById('ab-cfg').innerText = v.config_path;
  showModal('about');
}
function openRepo(path) { fetch('/api/open_url?url=' + encodeURIComponent(repoUrl + path), { method: 'POST' }); }

// ---------- start ----------
window.addEventListener('pagehide', () => navigator.sendBeacon('/api/closing'));
(async function start() {
  try {
    const d = await (await fetch('/api/config')).json();
    lang = pickLang(d.config.language);
    LAYOUT = d.config.column_layout || {};
  } catch (e) {}
  document.documentElement.lang = lang;
  applyI18n(document);
  showStatus();
  await pollStatus();
  setInterval(pollStatus, 4000);
})();
</script>
