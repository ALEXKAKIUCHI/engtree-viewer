<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EngTree Corte</title>
<style>
  /* Colours: dark like EngTree by default, light on request. */
  :root, [data-theme="dark"] {
    --bg:#1e1e2e; --card:#232336; --panel:#2a2a3e; --line:#3a3a4e; --ink:#e0e0e0; --soft:#9aa0b0;
    --input:#2a2a3e; --accent:#4a9eff; --accent-ink:#fff; --ok:#34d399; --okbg:#0f2e22; --bad:#f87171; --badbg:#3b1d1d;
    --warnbg:#3b2f0b; --warnline:#a16207; --warnink:#fde68a; --on:#2563eb; --hover:#34344a;
  }
  [data-theme="light"] {
    --bg:#f4f6f9; --card:#fff; --panel:#eef1f5; --line:#d5d9e0; --ink:#1c2430; --soft:#5d6878;
    --input:#fff; --accent:#1f6feb; --accent-ink:#fff; --ok:#1a7f37; --okbg:#dff5e3; --bad:#c62828; --badbg:#fde3e3;
    --warnbg:#fff7e0; --warnline:#e0b84a; --warnink:#6b4e00; --on:#1f6feb; --hover:#e6ebf2;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, "Segoe UI", sans-serif; color:var(--ink); background:var(--bg); }
  header { display:flex; align-items:center; gap:14px; padding:8px 18px; background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; }
  header .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
  .tabs { display:flex; gap:4px; }
  button, select, input { font:inherit; color:var(--ink); }
  button { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 12px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); background:var(--hover); }
  button:disabled { opacity:.45; cursor:default; }
  .tabs button.on { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600; }
  select, input[type=text] { background:var(--input); border:1px solid var(--line); border-radius:5px; padding:4px 6px; }
  input[type=text]:focus, select:focus, button:focus-visible { outline:none; border-color:var(--accent); box-shadow:0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  main { display:grid; grid-template-columns:minmax(520px, 780px) 1fr; gap:16px; padding:14px 18px; align-items:start; }
  @media (max-width: 1000px) { main { grid-template-columns:1fr; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:12px; }
  h2 { font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--soft); margin:0 0 8px; display:flex; gap:8px; align-items:center; }
  table.grid { width:100%; min-width:720px; border-collapse:collapse; table-layout:fixed; }
  .scroll { overflow-x:auto; }
  .totals + h2 { margin-top:14px; }
  table.grid th { text-align:left; font-weight:600; font-size:12px; color:var(--soft); padding:2px 4px; white-space:nowrap; }
  table.grid td { padding:1px 2px; }
  table.grid input[type=text] { width:100%; padding:4px 6px; }
  table.grid td.n input { text-align:right; }
  table.grid td.x { width:28px; }
  table.grid td.sw { width:34px; }
  .rot { width:100%; height:30px; padding:0; font-weight:600; }
  .rot.on { background:var(--on); border-color:var(--on); color:#fff; }
  .rot.off { color:var(--soft); }
  .hbtn { padding:1px 6px; font-size:11px; font-weight:500; border-radius:4px; }
  .mini { border:none; background:none; color:var(--soft); cursor:pointer; padding:2px 6px; }
  .mini:hover { color:var(--bad); background:none; }
  .link { border:none; background:none; color:var(--accent); cursor:pointer; padding:4px 0; }
  .link:hover { background:none; text-decoration:underline; }
  .hint { color:var(--soft); font-size:12px; margin:6px 0 0; }
  .set { display:grid; grid-template-columns:1fr 150px; gap:6px 10px; align-items:center; }
  .set input, .set select { width:100%; }
  .info { display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px 12px; }
  .info label { display:flex; flex-direction:column; gap:2px; font-size:12px; color:var(--soft); }
  .info .wide { grid-column:span 2; }
  .actions { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .go { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); padding:8px 18px; font-weight:600; }
  .stop { color:var(--bad); border-color:var(--bad); }
  .sum { display:flex; gap:18px; flex-wrap:wrap; align-items:baseline; }
  .sum b { font-size:20px; }
  .sum span { color:var(--soft); }
  .badge { padding:2px 10px; border-radius:20px; font-size:12px; font-weight:600; }
  .badge.ok { background:var(--okbg); color:var(--ok); }
  .badge.bad { background:var(--badbg); color:var(--bad); }
  .badge.run { background:color-mix(in srgb, var(--accent) 20%, transparent); color:var(--accent); }
  .warn { color:var(--bad); margin:6px 0 0; }
  .export { margin:12px 0 4px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .export small { flex-basis:100%; color:var(--soft); }
  .item { border-top:1px solid var(--line); padding:12px 0; }
  .item:first-child { border-top:none; }
  .item h3 { font-size:14px; margin:0 0 8px; }
  .item h3 small { font-weight:400; color:var(--soft); }
  .layout { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
  .layout .draw { flex:0 0 auto; width:min(420px, 100%); }
  .layout .draw svg { width:100%; height:auto; display:block; background:#fff; border-radius:4px; }
  .layout .list { flex:1 1 260px; min-width:240px; }
  .bar svg { width:100%; height:auto; display:block; background:#fff; border-radius:4px; }
  table.parts { width:100%; border-collapse:collapse; font-size:12.5px; }
  table.parts th { text-align:left; color:var(--soft); font-weight:600; border-bottom:1px solid var(--line); padding:3px 5px; }
  table.parts td { padding:3px 5px; border-bottom:1px solid var(--line); }
  table.parts td.r, table.parts th.r { text-align:right; }
  table.parts td.k { font-weight:700; }
  .line { font-family:ui-monospace, Consolas, monospace; font-size:13px; margin:4px 0 0; }
  details { margin-top:6px; }
  details summary { cursor:pointer; color:var(--accent); }
  details ol { margin:6px 0 0; padding-left:26px; font-size:13px; }
  .empty { color:var(--soft); padding:30px 0; text-align:center; }
  .totals { display:grid; grid-template-columns:repeat(auto-fit, minmax(250px, 1fr)); gap:2px 24px; margin-top:10px; padding-top:10px; border-top:1px solid var(--line); font-size:13px; color:var(--soft); }
  .totals div b { font-weight:600; color:var(--ink); }
  .thumbs { display:grid; grid-template-columns:repeat(auto-fill, minmax(120px, 1fr)); gap:14px; padding-bottom:12px; }
  .thumb { position:relative; cursor:pointer; border:1px solid var(--line); border-radius:6px; padding:6px; background:#fff; }
  .thumb:hover { border-color:var(--accent); }
  .thumb .n { position:absolute; top:-8px; left:-8px; background:var(--accent); color:#fff; border-radius:6px; padding:0 7px; font-weight:700; font-size:13px; }
  .thumb .cap { font-size:11px; color:#5d6878; margin-top:4px; display:flex; justify-content:space-between; }
  .toast { position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:var(--ok); color:#fff; padding:8px 16px; border-radius:6px; display:none; z-index:20; }
</style>
</head>
<body>
<header>
  <h1>EngTree Corte</h1>
  <div class="tabs">
    <button id="tab-linear" onclick="setMode('linear')" data-t="linear"></button>
    <button id="tab-rectangular" onclick="setMode('rectangular')" data-t="rectangular"></button>
  </div>
  <div class="right">
    <button onclick="openPlan()" data-t="open"></button>
    <button onclick="savePlan()" data-t="save"></button>
    <button onclick="sendAnalysis()" data-t="analysis" id="analysis-btn"></button>
    <input type="file" id="plan-file" accept=".json,.engcorte" style="display:none" onchange="loadPlanFile(this)">
    <select id="theme" onchange="setTheme(this.value)" aria-label="theme"></select>
    <select id="lang" onchange="setLang(this.value)" aria-label="language">
      <option value="pt">Português</option>
      <option value="en">English</option>
    </select>
  </div>
</header>
<main>
  <div>
    <section>
      <h2 data-t="plan_data"></h2>
      <div class="info" id="info"></div>
    </section>
    <section>
      <h2 data-t="parts"></h2>
      <div class="scroll"><table class="grid" id="parts"></table></div>
      <button class="link" onclick="addRow('parts')" data-t="add_row"></button>
      <p class="hint"><span data-t="material_hint"></span> <span data-t="paste_hint"></span> <span id="rotate-hint" data-t="rotate_hint"></span></p>
    </section>
    <section>
      <h2 data-t="stock"></h2>
      <div class="scroll"><table class="grid" id="stock"></table></div>
      <button class="link" onclick="addRow('stock')" data-t="add_row"></button>
      <p class="hint" data-t="stock_hint"></p>
    </section>
    <section>
      <h2 data-t="settings"></h2>
      <div class="set" id="settings"></div>
    </section>
    <section class="actions">
      <button class="go" id="go" onclick="run()" data-t="calculate"></button>
      <button class="stop" id="stop" onclick="stop()" disabled data-t="stop"></button>
      <button class="link" onclick="loadExample()" data-t="example"></button>
      <button class="link" onclick="clearAll()" data-t="clear"></button>
    </section>
  </div>
  <div>
    <section id="summary"><div class="empty" data-t="nothing_yet"></div></section>
    <div id="plan" hidden></div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
// ---------- texts ----------
const TEXT = {
  en: {
    linear: 'Linear (bars and tubes)', rectangular: 'Rectangular (sheets)',
    open: 'Open plan…', save: 'Save plan', analysis: 'Send for analysis', theme_dark: 'Dark', theme_light: 'Light',
    plan_data: 'Plan', product: 'Product / project', product_desc: 'Description', order: 'Order', user: 'User',
    material: 'Mat. code', material_desc: 'Material', thick: 'Thick.',
    no_stock: '{0}: no stock with this material code. Parts left out: {1}', no_code: '(no code)', materials_n: 'materials',
    mat_state_waiting: 'waiting', mat_state_running: 'calculating…', mat_state_done: 'done', mat_state_error: 'error', mat_state_stopped: 'stopped',
    material_hint: 'Parts are cut from the stock with the same material code (Mat. code). Each code is planned on its own; a part without a code uses the stock without a code.',
    parts: 'Parts', stock: 'Stock, in order of use', settings: 'Settings', add_row: '+ add row',
    paste_hint: 'Tab moves to the next cell; at the end of the table it adds a row. Rows copied from a spreadsheet can be pasted.', rotate_hint: 'Space or a click turns "Can rotate" on and off.',
    stock_hint: 'Offcuts first, full size last. Quantity 0 = as many as needed.',
    calculate: 'Calculate', stop: 'Stop', example: 'Load example', clear: 'Clear',
    nothing_yet: 'Fill in the parts and the stock, then press Calculate.',
    id: 'Code', desc: 'Description', project: 'Project', length: 'Length', width: 'Width', qty: 'Qty', rotate: 'Can rotate',
    all: 'all', none_btn: 'none', swap: 'Swap length and width', swap_all: '⇄ swap all', yes: '✓ yes', no: '—',
    kerf: 'Cut width (kerf), mm', start_loss: 'Loss at the start of the bar, mm', end_loss: 'Loss at the end of the bar, mm',
    min_offcut: 'Shortest offcut worth keeping, mm', time_limit: 'Time limit, s (0 = default)',
    edge_trim: 'Edge trim, each side, mm', stages: 'Cutting stages', first_cut: 'First cut',
    auto: 'Planner chooses', along_length: 'Along the length', along_width: 'Along the width',
    min_offcut_length: 'Smallest offcut worth keeping: length, mm', min_offcut_width: 'Smallest offcut worth keeping: width, mm',
    running: 'calculating…', verified: 'verified', not_verified: 'failed the verifier', error: 'Error',
    bars: 'bars', sheets: 'sheets', utilization: 'use', left_out: 'Left out (found no stock)',
    bar: 'Bar', sheet: 'Sheet', remainder: 'remainder', offcut: 'offcut', scrap: 'scrap', no_remainder: 'no remainder',
    cuts: 'Cut list', stage: 'Stage', at: 'at', from: 'from', to: 'to', times: 'equal',
    offcuts: 'Offcuts', none: 'none', first: 'first cut', ms: 'ms', size: 'Size (W × H)',
    overview: 'Overview', total_sheets: 'Sheets', total_bars: 'Bars', total_parts: 'Parts', total_offcuts: 'Offcuts kept', total_cuts: 'Cuts',
    plans: 'Different plans', losses: 'Loss at start / end',
    need_parts: 'Add at least one part and one stock size.',
    export_pdf: 'Export PDF report', export_production: 'Export for production',
    export_hint_rect: '"Export for production" gives one ZIP with the PDF report and the .AC and .AD files of the Giben saw. Test first: open the files in GVision without cutting.',
    export_hint_linear: '"Export for production" gives one ZIP with the PDF report.',
    saved: 'Plan saved', opened: 'Plan opened', analysis_done: 'File saved. Send it with a note on what is wrong.',
    bad_file: 'This file is not an EngTree Corte plan.',
  },
  pt: {
    linear: 'Linear (barras e tubos)', rectangular: 'Retangular (chapas)',
    open: 'Abrir plano…', save: 'Salvar plano', analysis: 'Enviar para análise', theme_dark: 'Escuro', theme_light: 'Claro',
    plan_data: 'Dados do plano', product: 'Produto / projeto', product_desc: 'Descrição', order: 'Pedido', user: 'Usuário',
    material: 'Cód. MP', material_desc: 'Material', thick: 'Esp.',
    no_stock: '{0}: não há chapa ou barra com este código no estoque. Peças que ficaram de fora: {1}', no_code: '(sem código)', materials_n: 'materiais',
    mat_state_waiting: 'na fila', mat_state_running: 'calculando…', mat_state_done: 'pronto', mat_state_error: 'erro', mat_state_stopped: 'parado',
    material_hint: 'As peças saem do estoque com o mesmo código de matéria-prima (Cód. MP). Cada código é calculado separado; peça sem código usa o estoque sem código.',
    parts: 'Peças', stock: 'Estoque, na ordem de uso', settings: 'Ajustes', add_row: '+ adicionar linha',
    paste_hint: 'Tab passa para a próxima célula; no fim da tabela, cria uma linha. Dá para colar linhas copiadas de uma planilha.', rotate_hint: 'Espaço ou um clique liga e desliga o "Pode girar".',
    stock_hint: 'Retalhos primeiro, tamanho inteiro por último. Quantidade 0 = quantas forem necessárias.',
    calculate: 'Calcular', stop: 'Parar', example: 'Carregar exemplo', clear: 'Limpar',
    nothing_yet: 'Preencha as peças e o estoque e clique em Calcular.',
    id: 'Código', desc: 'Descrição', project: 'Projeto', length: 'Comp.', width: 'Larg.', qty: 'Qtd', rotate: 'Pode girar',
    all: 'todas', none_btn: 'nenhuma', swap: 'Inverter comprimento e largura', swap_all: '⇄ inverter todas', yes: '✓ sim', no: '—',
    kerf: 'Espessura do corte (kerf), mm', start_loss: 'Perda no início da barra, mm', end_loss: 'Perda no fim da barra, mm',
    min_offcut: 'Menor sobra que vale guardar, mm', time_limit: 'Limite de tempo, s (0 = padrão)',
    edge_trim: 'Refilo, em cada lado, mm', stages: 'Etapas de corte', first_cut: 'Primeiro corte',
    auto: 'O programa escolhe', along_length: 'Ao longo do comprimento', along_width: 'Ao longo da largura',
    min_offcut_length: 'Menor sobra que vale guardar: comprimento, mm', min_offcut_width: 'Menor sobra que vale guardar: largura, mm',
    running: 'calculando…', verified: 'verificado', not_verified: 'reprovado no verificador', error: 'Erro',
    bars: 'barras', sheets: 'chapas', utilization: 'aproveitamento', left_out: 'Ficaram de fora (sem estoque que sirva)',
    bar: 'Barra', sheet: 'Chapa', remainder: 'sobra', offcut: 'retalho', scrap: 'descarte', no_remainder: 'sem sobra',
    cuts: 'Lista de cortes', stage: 'Etapa', at: 'em', from: 'de', to: 'a', times: 'iguais',
    offcuts: 'Sobras', none: 'nenhuma', first: 'primeiro corte', ms: 'ms', size: 'Medidas (L × A)',
    overview: 'Visão geral', total_sheets: 'Total de chapas', total_bars: 'Total de barras', total_parts: 'Total de peças', total_offcuts: 'Total de sobras (retalhos)', total_cuts: 'Total de cortes',
    plans: 'Planos de corte diferentes', losses: 'Perda no início / fim',
    need_parts: 'Informe pelo menos uma peça e um tamanho de estoque.',
    export_pdf: 'Exportar relatório PDF', export_production: 'Exportar para produção',
    export_hint_rect: '"Exportar para produção" baixa um ZIP com o relatório PDF e os arquivos .AC e .AD da seccionadora Giben. Teste antes: abra os arquivos no GVision sem cortar.',
    export_hint_linear: '"Exportar para produção" baixa um ZIP com o relatório PDF.',
    saved: 'Plano salvo', opened: 'Plano aberto', analysis_done: 'Arquivo salvo. Envie junto com uma nota do que está errado.',
    bad_file: 'Este arquivo não é um plano do EngTree Corte.',
  },
};
let lang = localStorage.getItem('engtreecorte.lang') || ((navigator.language || 'en').startsWith('pt') ? 'pt' : 'en');
const t = (k, ...a) => String(TEXT[lang][k] ?? k).replace(/\{(\d)\}/g, (_, i) => a[i] ?? '');

// ---------- what each mode asks for ----------
// Columns: [key, label, kind] — kind: text, num, int, rotate.
const MODES = {
  linear: {
    parts: [['id', 'id', 'text'], ['desc', 'desc', 'text'], ['material', 'material', 'text'], ['length', 'length', 'num'], ['quantity', 'qty', 'int'], ['project', 'project', 'text']],
    stock: [['id', 'id', 'text'], ['material', 'material', 'text'], ['material_desc', 'material_desc', 'text'], ['thickness', 'thick', 'num'],
            ['length', 'length', 'num'], ['quantity', 'qty', 'int']],
    settings: [['kerf', 'kerf', 3], ['start_loss', 'start_loss', 0], ['end_loss', 'end_loss', 0],
               ['min_offcut', 'min_offcut', 300], ['time_limit_sec', 'time_limit', 0]],
    example: {
      parts: [['T-850', 'TRAVESSA', 'TB3030', 850, 12, ''], ['T-1200', 'PERNA', 'TB3030', 1200, 8, ''], ['T-2310', 'LONGARINA', 'TB5030', 2310, 5, ''],
              ['T-455', 'REFORÇO', 'TB3030', 455, 20, ''], ['T-3050', 'BASE', 'TB5030', 3050, 3, '']],
      stock: [['retalho 2400', 'TB3030', 'TUBO 30X30', 1.5, 2400, 2], ['barra 6000', 'TB3030', 'TUBO 30X30', 1.5, 6000, 0],
              ['barra 6000', 'TB5030', 'TUBO 50X30', 2, 6000, 0]],
      settings: { kerf: 3, start_loss: 20, end_loss: 150, min_offcut: 300, time_limit_sec: 0 },
    },
  },
  rectangular: {
    parts: [['id', 'id', 'text'], ['desc', 'desc', 'text'], ['material', 'material', 'text'], ['length', 'length', 'num'], ['width', 'width', 'num'],
            ['quantity', 'qty', 'int'], ['can_rotate', 'rotate', 'rotate'], ['project', 'project', 'text']],
    stock: [['id', 'id', 'text'], ['material', 'material', 'text'], ['material_desc', 'material_desc', 'text'], ['thickness', 'thick', 'num'],
            ['length', 'length', 'num'], ['width', 'width', 'num'], ['quantity', 'qty', 'int']],
    settings: [['kerf', 'kerf', 4], ['edge_trim', 'edge_trim', 10], ['stages', 'stages', 3], ['first_cut', 'first_cut', ''],
               ['min_offcut_length', 'min_offcut_length', 300], ['min_offcut_width', 'min_offcut_width', 300],
               ['time_limit_sec', 'time_limit', 0]],
    example: {
      parts: [['A1', 'LATERAL', 'MDF15', 2100, 550, 4, false, ''], ['A2', 'BASE', 'MDF15', 1164, 550, 4, true, ''], ['A3', 'PRATELEIRA', 'MDF15', 1164, 520, 10, true, ''],
              ['A4', 'PORTA', 'MDF18', 2090, 395, 6, false, ''], ['A5', 'FUNDO', 'MDF6', 2100, 1190, 2, true, ''], ['A6', 'RODAPÉ', 'MDF15', 1164, 100, 4, true, '']],
      stock: [['retalho', 'MDF15', 'MDF BRANCO 15MM', 15, 1300, 900, 1], ['chapa 2750x1830', 'MDF15', 'MDF BRANCO 15MM', 15, 2750, 1830, 0],
              ['chapa 2750x1830', 'MDF18', 'MDF BRANCO 18MM', 18, 2750, 1830, 0], ['chapa 2750x1830', 'MDF6', 'MDF BRANCO 6MM', 6, 2750, 1830, 0]],
      settings: { kerf: 4, edge_trim: 10, stages: 3, first_cut: '', min_offcut_length: 300, min_offcut_width: 300, time_limit_sec: 0 },
    },
  },
};
const STAGES = [2, 3];

// ---------- state ----------
let mode = localStorage.getItem('engtreecorte.mode') || 'rectangular';
if (!MODES[mode]) mode = 'rectangular';
let data = upgrade(JSON.parse(localStorage.getItem('engtreecorte.data') || 'null') || migrateOld());
function blank(m) {
  const settings = {};
  for (const [key, , def] of MODES[m].settings) settings[key] = def;
  return { parts: [emptyRow(m, 'parts')], stock: [emptyRow(m, 'stock')], settings };
}
function emptyRow(m, table) { return MODES[m][table].map(([, , kind]) => kind === 'rotate' ? false : ''); }
// The test screen kept its data under cuttest.*, with no description or
// project columns: bring it over once.
function migrateOld() {
  const old = JSON.parse(localStorage.getItem('cuttest.data') || '{}');
  const d = { v: 2, header: { product: '', product_desc: '', order: '', user: '' } };
  for (const m in MODES) {
    if (!old[m]) continue;
    d[m] = { ...blank(m), settings: { ...blank(m).settings, ...old[m].settings }, stock: old[m].stock || blank(m).stock };
    d[m].parts = (old[m].parts || []).map(r => { const n = [r[0], '', ...r.slice(1)]; n.push(''); return n; });
    if (!d[m].parts.length) d[m].parts = [emptyRow(m, 'parts')];
  }
  if (old.giben) {
    d.header.product = old.giben.project || '';
    if (d.rectangular) d.rectangular.material = { code: '', desc: old.giben.material || '', thickness: old.giben.thickness || '' };
  }
  return d;
}
// Version 2 had one material for the whole plan, in the plan data; version
// 3 gives each part and each stock row its material code. The old material
// goes to every row, so the plan still calculates the same way.
function upgrade(d) {
  if (d.v === 2) {
    for (const m in MODES) {
      if (!d[m]) continue;
      const mat = d[m].material || {};
      d[m].parts = (d[m].parts || []).map(r => [r[0], r[1], mat.code || '', ...r.slice(2)]);
      d[m].stock = (d[m].stock || []).map(r => [r[0], mat.code || '', mat.desc || '', mat.thickness || '', ...r.slice(1)]);
      delete d[m].material;
    }
    d.v = 3;
  }
  return d;
}
for (const m in MODES) if (!data[m]) data[m] = blank(m);

const col = (table, key) => MODES[mode][table].findIndex(c => c[0] === key);

// ---------- theme and language ----------

// ---------- plan data ----------
function drawInfo() {

// ---------- tables ----------
function drawTable(table) {
  const cols = MODES[mode][table], rows = data[mode][table];
  const swaps = table === 'parts' && mode === 'rectangular';
  // Column widths: the description gets the room, numbers stay narrow.
  const width = (key, kind) => kind === 'rotate' ? '96px' : key === 'desc' ? '' : key === 'material_desc' ? '' :
    key === 'material' ? '96px' : key === 'id' ? (table === 'parts' ? '96px' : '150px') : key === 'project' ? '90px' :
    key === 'thickness' ? '52px' : kind === 'int' ? '52px' : kind === 'num' ? '66px' : '';
  let html = '<colgroup>' + cols.map(([key, , kind]) => `<col style="width:${width(key, kind)}">` + (swaps && key === 'width' ? '<col style="width:34px">' : '')).join('') +
    '<col style="width:28px"></colgroup><tr>' + cols.map(([key, label, kind]) => {
    if (kind === 'rotate') return `<th>${esc(t(label))}<br><button class="hbtn" onclick="setAll(true)">${esc(t('all'))}</button>
      <button class="hbtn" onclick="setAll(false)">${esc(t('none_btn'))}</button></th>`;
    if (swaps && key === 'width') return `<th>${esc(t(label))}</th><th><button class="hbtn" title="${esc(t('swap_all'))}" onclick="swapAll()">⇄</button></th>`;
    return `<th>${esc(t(label))}</th>`;
  }).join('') + '<th></th></tr>';
  rows.forEach((row, r) => {
    html += '<tr>' + cols.map(([key, , kind], c) => {
      const at = `data-table="${table}" data-r="${r}" data-c="${c}"`;
      let cell;
      if (kind === 'rotate') cell = `<td class="c"><button class="rot ${row[c] ? 'on' : 'off'}" ${at} aria-pressed="${!!row[c]}"
          onclick="toggleRotate(${r},${c})" onkeydown="cellKey(event)">${esc(t(row[c] ? 'yes' : 'no'))}</button></td>`;
      else cell = `<td class="${kind === 'num' || kind === 'int' ? 'n' : ''}"><input type="text" value="${esc(row[c])}" ${at}
          oninput="setCell('${table}',${r},${c},this.value)" onkeydown="cellKey(event)" onpaste="cellPaste(event)"></td>`;
      if (swaps && key === 'width') cell += `<td class="sw"><button class="mini" tabindex="-1" title="${esc(t('swap'))}" onclick="swapRow(${r})">⇄</button></td>`;
      return cell;
    }).join('') + `<td class="x"><button class="mini" tabindex="-1" onclick="delRow('${table}',${r})">×</button></td></tr>`;
  });
  document.getElementById(table).innerHTML = html;
}
function setCell(table, r, c, v) { data[mode][table][r][c] = v; save(); }
function toggleRotate(r, c) {
  const rows = data[mode].parts;
  rows[r][c] = !rows[r][c]; save(); drawTable('parts');
  document.querySelector(`button[data-table=parts][data-r="${r}"][data-c="${c}"]`)?.focus();
}
function setAll(on) { const c = col('parts', 'can_rotate'); data[mode].parts.forEach(row => row[c] = on); save(); drawTable('parts'); }
function swapRow(r) {
  const row = data[mode].parts[r], l = col('parts', 'length'), w = col('parts', 'width');
  [row[l], row[w]] = [row[w], row[l]]; save(); drawTable('parts');
}
function swapAll() { data[mode].parts.forEach((_, r) => swapRow(r)); }
function addRow(table, focus = true) {
  data[mode][table].push(emptyRow(mode, table)); save(); drawTable(table);
  if (focus) document.querySelector(`[data-table=${table}][data-r="${data[mode][table].length - 1}"][data-c="0"]`)?.focus();
}
function delRow(table, r) {
  data[mode][table].splice(r, 1);
  if (!data[mode][table].length) data[mode][table].push(emptyRow(mode, table));
  save(); drawTable(table);
}
// Tab on the last cell of the last row starts a new row. Enter moves down,
// or starts a new row (on the "can rotate" button, Enter and space toggle).
function cellKey(e) {
  const el = e.target, table = el.dataset.table, rows = data[mode][table];
  const lastRow = +el.dataset.r === rows.length - 1;
  const lastCol = +el.dataset.c === MODES[mode][table].length - 1;
  if (e.key === 'Tab' && !e.shiftKey && lastRow && lastCol) { e.preventDefault(); addRow(table); }
  else if (e.key === 'Enter' && el.tagName === 'INPUT') {
    e.preventDefault();
    if (lastRow) addRow(table);
    else document.querySelector(`[data-table=${table}][data-r="${+el.dataset.r + 1}"][data-c="${el.dataset.c}"]`)?.focus();
  }
}
// Cells copied from a spreadsheet arrive as lines of tab-separated text.
function cellPaste(e) {
  const text = e.clipboardData.getData('text');
  if (!/[\t\n]/.test(text.trim())) return;
  e.preventDefault();
  const el = e.target, table = el.dataset.table, rows = data[mode][table];
  const cols = MODES[mode][table];
  text.replace(/\r/g, '').split('\n').filter(l => l.trim() !== '').forEach((line, i) => {
    const r = +el.dataset.r + i;
    while (rows.length <= r) rows.push(emptyRow(mode, table));
    line.split('\t').forEach((v, k) => {
      const c = +el.dataset.c + k;
      if (c >= cols.length) return;
      rows[r][c] = cols[c][2] === 'rotate' ? /^(s|y|sim|yes|1|x|true)$/i.test(v.trim()) : v.trim();
    });
  });
  save(); drawTable(table);
}
function drawSettings() {
  const s = data[mode].settings;
  document.getElementById('settings').innerHTML = MODES[mode].settings.map(([key, label]) => {
    let input;
    if (key === 'stages') input = `<select onchange="setSetting('stages', +this.value)">${STAGES.map(n => `<option ${+s.stages === n ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
    else if (key === 'first_cut') input = `<select onchange="setSetting('first_cut', this.value)">${[['', 'auto'], ['length', 'along_length'], ['width', 'along_width']]
      .map(([v, l]) => `<option value="${v}" ${s.first_cut === v ? 'selected' : ''}>${esc(t(l))}</option>`).join('')}</select>`;
    else input = `<input type="text" value="${esc(s[key])}" oninput="setSetting('${key}', this.value)">`;
    return `<label>${esc(t(label))}</label>${input}`;
  }).join('');
}
function setSetting(key, v) { data[mode].settings[key] = v; save(); }
function loadExample() {

// The job exactly as the planner reads it; partMeta keeps what the planner
// does not need (description, project) for the report.
let partMeta = [];
function buildJob() {
  const read = table => data[mode][table].map(row => {
    const o = {};
    MODES[mode][table].forEach(([key, , kind], c) => {
      o[key] = kind === 'text' ? String(row[c] ?? '').trim() : kind === 'rotate' ? !!row[c] : kind === 'int' ? Math.round(num(row[c])) : num(row[c]);
    });
    return o;
  }).filter(o => o.length > 0);
  const parts = read('parts').map((p, i) => ({ ...p, id: p.id || `P${i + 1}`, quantity: p.quantity || 1 }));
  const stock = read('stock').map((s, i) => ({ ...s, id: s.id || `S${i + 1}` }));
  const unique = list => { const seen = {}; for (const o of list) { seen[o.id] = (seen[o.id] || 0) + 1; if (seen[o.id] > 1) o.id += ` (${seen[o.id]})`; } };
  unique(parts); unique(stock);
  partMeta = parts.map(p => ({ id: p.id, desc: p.desc, project: p.project }));
  for (const p of parts) { delete p.desc; delete p.project; }
  const settings = {};
  for (const [key] of MODES[mode].settings) {
    const v = data[mode].settings[key];
    settings[key] = key === 'first_cut' ? v || '' : key === 'stages' || key === 'time_limit_sec' ? Math.round(num(v)) : Math.round(num(v) * 1000) / 1000;
  }
  return { parts, stock, settings };
}

// ---------- running ----------
let lastStatus = null, lastJob = null, lastMeta = [], timer = null;
async function run() {
  const job = buildJob();
  if (!job.parts.length || !job.stock.length) { alert(t('need_parts')); return; }
  lastJob = job; lastMeta = partMeta;
  await fetch('/api/run', { method: 'POST', body: JSON.stringify({ mode, job }) });
  clearInterval(timer);
  timer = setInterval(poll, 300);
  poll();
}
async function stop() { await fetch('/api/stop', { method: 'POST' }); }
async function poll() {
  const st = await (await fetch('/api/status')).json();
  if (st.mode && st.mode !== mode) return;
  lastStatus = st;
  if (st.state !== 'running') clearInterval(timer);
  drawResult();
}
// The window is alive while the page is open; closing it stops the program.
setInterval(() => fetch('/api/ping').catch(() => {}), 30000);
window.addEventListener('pagehide', () => navigator.sendBeacon('/api/closing'));

// ---------- files ----------
// fileNameOf reads the file name from a Content-Disposition header, in the
// UTF-8 form (filename*=utf-8''...) or the plain one.
function fileNameOf(r, fallback) {
  const h = r.headers.get('Content-Disposition') || '';
  const star = h.match(/filename\*=utf-8''([^;]+)/i);
  if (star) try { return decodeURIComponent(star[1]); } catch (e) {}
  return h.match(/filename="?([^";]+)"?/)?.[1] || fallback;
}
function download(name, blob) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const stamp = () => new Date().toISOString().slice(0, 16).replace('T', ' ').replace(':', '');
// File names lose their accents: some browsers refuse to save them otherwise.
const safe = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[<>:"/\\|?*]/g, '_').trim();
function savePlan() {
  const body = { kind: 'engtree-corte-plan', v: 3, mode, header: data.header, plan: data[mode] };
  download(`Plano ${safe(data.header.product) || mode} - ${stamp()}.json`, new Blob([JSON.stringify(body, null, 1)], { type: 'application/json' }));
  toast(t('saved'));
}
function openPlan() { document.getElementById('plan-file').click(); }
async function loadPlanFile(input) {
  const f = input.files[0];
  input.value = '';
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!['engtree-corte-plan', 'engtree-corte-analysis'].includes(d.kind) || !MODES[d.mode] || !d.plan) throw 0;
    const plan = d.v === 2 ? upgrade({ v: 2, [d.mode]: d.plan })[d.mode] : d.plan;
    data[d.mode] = { ...blank(d.mode), ...plan };
    if (d.header) data.header = { ...data.header, ...d.header };
    save(); toast(t('opened')); setMode(d.mode);
  } catch (e) { alert(t('bad_file')); }
}
// Everything needed to reproduce a case: the screen, the job, the result
// and what the verifier said.
async function sendAnalysis() {
  let version = '';
  try { version = (await (await fetch('/api/version')).json()).version; } catch (e) {}
  const body = { kind: 'engtree-corte-analysis', v: 3, version, created: new Date().toISOString(), lang, mode,
    header: data.header, plan: data[mode], job: lastJob || buildJob(), status: lastStatus, userAgent: navigator.userAgent };

async function exportPlan(kind) {
  const h = data.header;
  const materials = (lastStatus.materials || []).filter(m => m.result && (m.state === 'done' || m.state === 'stopped'))
    .map(m => ({ code: m.code, desc: m.desc, thickness: m.thickness, job: m.job, result: m.result }));
  const body = { mode, lang, materials, parts: lastMeta,
    info: { product: h.product, product_desc: h.product_desc, order: h.order, user: h.user } };

// ---------- result side ----------
const PALETTE = ['#cfe3ff', '#ffe0b8', '#d4f5d4', '#f6d3f0', '#fff3b0', '#d8d4ff', '#c8f0ee', '#ffd6d6'];
function colourOf(id) {
  const i = (lastJob?.parts || []).findIndex(p => p.id === id);
  return PALETTE[(i < 0 ? 0 : i) % PALETTE.length];
}
const metaOf = id => lastMeta.find(m => m.id === id) || {};

// The result: a headline for the whole plan, then one block per material.
function drawResult() {
  const st = lastStatus, sum = document.getElementById('summary'), plan = document.getElementById('plan');
  const running = st?.state === 'running';
  document.getElementById('go').disabled = running;
  document.getElementById('stop').disabled = !running;
  if (!st || st.state === 'idle') { sum.innerHTML = `<div class="empty">${esc(t('nothing_yet'))}</div>`; plan.hidden = true; return; }
  if (st.state === 'error') { sum.innerHTML = `<p class="warn"><b>${esc(t('error'))}:</b> ${esc(st.error)}</p>`; plan.hidden = true; return; }
  const mats = st.materials || [], withResult = mats.filter(m => m.result);
  const count = withResult.reduce((a, m) => a + (st.mode === 'linear' ? m.result.bars.length : m.result.sheets.length), 0);
  const allDone = !running && mats.length > 0 && mats.every(m => m.state === 'done' || m.state === 'stopped');
  const allOk = allDone && mats.every(m => m.verified);
  let html = `<div class="sum"><div><b>${mats.length}</b> <span>${esc(t('materials_n'))}</span></div>
    <div><b>${count}</b> <span>${esc(t(st.mode === 'linear' ? 'bars' : 'sheets'))}</span></div>`;
  if (running) html += `<span class="badge run">${esc(t('running'))}</span>`;
  else if (mats.length) html += allOk ? `<span class="badge ok">✓ ${esc(t('verified'))}</span>` : `<span class="badge bad">${esc(t('not_verified'))}</span>`;
  html += '</div>';
  for (const ns of st.no_stock || []) html += `<p class="warn">${esc(t('no_stock', ns.code || t('no_code'), ns.parts.join(', ')))}</p>`;
  if (allOk && withResult.length && lastJob) {
    html += `<div class="export"><button onclick="exportPlan('pdf')">${esc(t('export_pdf'))}</button>
      <button class="go" onclick="exportPlan('production')">${esc(t('export_production'))}</button>
      <small>${esc(t(st.mode === 'rectangular' ? 'export_hint_rect' : 'export_hint_linear'))}</small></div>`;
  }
  sum.innerHTML = html;
  plan.hidden = !mats.length;
  plan.innerHTML = mats.map((m, i) => materialBlock(st.mode, m, i)).join('');
}

function materialBlock(m, mat, i) {
  const res = mat.result, job = JSON.parse(JSON.stringify(mat.job || {}));
  const title = `${esc(mat.code || t('no_code'))}${mat.desc ? ' · ' + esc(mat.desc) : ''}${mat.thickness ? ' · ' + fmt(mat.thickness) + ' mm' : ''}`;
  let head = `<h2 style="font-size:14px;color:var(--ink);text-transform:none;letter-spacing:0">${title}</h2><div class="sum">`;
  if (res) {
    const items = m === 'linear' ? res.bars : res.sheets;
    head += `<div><b>${items.length}</b> <span>${esc(t(m === 'linear' ? 'bars' : 'sheets'))}</span></div>
      <div><b>${fmt(useOf(m, res) * 100)}%</b> <span>${esc(t('utilization'))}</span></div><div><span>${res.elapsed_ms} ${t('ms')}</span></div>`;
  }
  const running = mat.state === 'running' || mat.state === 'waiting';
  head += running ? `<span class="badge run">${esc(t('mat_state_' + mat.state))}</span>` :
    mat.state === 'error' ? `<span class="badge bad">${esc(t('error'))}</span>` :
    mat.verified ? `<span class="badge ok">✓ ${esc(t('verified'))}</span>` : `<span class="badge bad">${esc(t('not_verified'))}</span>`;
  head += '</div>';
  if (mat.error) head += `<p class="warn"><b>${esc(t('error'))}:</b> ${esc(mat.error)}</p>`;
  if (!res) return `<section>${head}</section>`;
  if (res.unplaced?.length) head += `<p class="warn"><b>${esc(t('left_out'))}:</b> ${res.unplaced.map(u => `${esc(u.part_id)} × ${u.quantity}`).join(', ')}</p>`;
  for (const w of res.warnings || []) head += `<p class="warn">${esc(w)}</p>`;
  if (!running && !mat.verified) head += (mat.problems || []).map(p => `<p class="warn">${esc(p)}</p>`).join('');
  head += totals(m, res);
  return `<section>${head}${m === 'linear' ? drawBars(res, job.parts || []) : drawSheets(res, i)}</section>`;
}

// Use over the whole sheets or bars, as the report prints it.
function useOf(m, res) {
  if (m === 'linear') {
    const total = res.bars.reduce((a, b) => a + b.length, 0);
    return total ? res.bars.reduce((a, b) => a + b.cuts.reduce((x, c) => x + c.length, 0), 0) / total : 0;
  }
  return sheetUse(res.sheets);
}
function sheetUse(sheets) {
  const size = Object.fromEntries((lastJob?.parts || []).map(p => [p.id, p.length * p.width]));
  const total = sheets.reduce((a, s) => a + s.length * s.width, 0);
  return total ? sheets.reduce((a, s) => a + s.placements.reduce((x, p) => x + (size[p.part_id] || 0), 0), 0) / total : 0;
}

// Equal bars (or sheets) are shown once, with a count, in order of first use.
function grouped(items, keyOf) {
  const out = [], byKey = {};
  items.forEach((it, i) => {
    const key = keyOf(it);
    if (byKey[key]) byKey[key].count++; else { byKey[key] = { key, item: it, first: i + 1, count: 1 }; out.push(byKey[key]); }
  });
  return out;
}
const range = g => g.count > 1 ? `${g.first}–${g.first + g.count - 1} <small>(${g.count} ${esc(t('times'))})</small>` : `${g.first}`;
const barKey = b => b.stock_id + '|' + b.cuts.map(c => c.part_id).join('+');

// Bars: parts are numbered by their place in the part list, as in the report.
function drawBars(res, parts) {
  const s = lastJob?.settings || {};
  const numOf = id => parts.findIndex(p => p.id === id) + 1;
  const longest = Math.max(...res.bars.map(b => b.length));
  let html = grouped(res.bars, barKey).map(g => {
    const b = g.item, H = longest / 28, end = b.length - (s.end_loss || 0);
    let svg = `<svg viewBox="0 0 ${longest} ${H}"><rect x="0" y="0" width="${b.length}" height="${H}" fill="#eef0f3" stroke="#555" stroke-width="${H / 25}"/>`;
    if (s.start_loss) svg += `<rect x="0" y="0" width="${s.start_loss}" height="${H}" fill="#c9ced6"/>`;
    if (s.end_loss) svg += `<rect x="${end}" y="0" width="${s.end_loss}" height="${H}" fill="#c9ced6"/>`;
    for (const c of b.cuts) {
      svg += `<rect x="${c.start}" y="0" width="${c.length}" height="${H}" fill="${colourOf(c.part_id)}" stroke="#333" stroke-width="${H / 25}"/>`;
      if (c.length > longest / 22) svg += `<text x="${c.start + c.length / 2}" y="${H * 0.64}" style="font-size:${H * 0.4}px" text-anchor="middle" fill="#111"><tspan font-weight="700" style="font-size:${H * 0.4}px">${numOf(c.part_id)}</tspan> · ${fmt(c.length)}</text>`;
    }
    if (b.remainder > 0) svg += `<rect x="${end - b.remainder}" y="0" width="${b.remainder}" height="${H}" fill="${b.reusable ? '#c9efd2' : '#f1d4d4'}"/>`;
    svg += '</svg>';
    const rem = b.remainder > 0 ? `${t('remainder')} ${fmt(b.remainder)} (${t(b.reusable ? 'offcut' : 'scrap')})` : t('no_remainder');
    return `<div class="item bar"><h3>${esc(t('bar'))} ${range(g)} <small>· ${esc(b.stock_id)} · ${fmt(b.length)} mm</small></h3>${svg}
      <p class="line">${b.cuts.map(c => `${numOf(c.part_id)}) ${fmt(c.length)}`).join(' + ')} &nbsp;|&nbsp; ${esc(rem)}</p></div>`;
  }).join('');
  html += `<div class="item"><table class="parts"><tr><th>N</th><th>${esc(t('id'))}</th><th>${esc(t('desc'))}</th><th class="r">${esc(t('length'))}</th><th class="r">${esc(t('qty'))}</th></tr>` +
    parts.map((p, i) => `<tr><td class="k">${i + 1}</td><td>${esc(p.id)}</td><td>${esc(metaOf(p.id).desc)}</td><td class="r">${fmt(p.length)}</td><td class="r">${p.quantity}</td></tr>`).join('') + '</table></div>';
  return html;
}

// The totals under the headline numbers.
function totals(m, res) {
  const s = lastJob?.settings || {}, row = (label, value) => `<div>${esc(t(label))}: <b>${value}</b></div>`;
  const m2 = a => (Math.round(a / 1e4) / 100).toLocaleString(lang === 'pt' ? 'pt-BR' : 'en-US') + ' m²', mt = l => fmt(l / 1000) + ' m';
  let html = '<div class="totals">';
  if (m === 'linear') {
    const cuts = res.bars.flatMap(b => b.cuts), keep = res.bars.filter(b => b.reusable);
    html += row('total_bars', `${res.bars.length} (${mt(res.bars.reduce((a, b) => a + b.length, 0))})`)
      + row('total_parts', `${cuts.length} (${mt(cuts.reduce((a, c) => a + c.length, 0))})`)
      + row('total_offcuts', `${keep.length} (${mt(keep.reduce((a, b) => a + b.remainder, 0))})`)
      + row('plans', grouped(res.bars, barKey).length)
      + row('kerf', fmt(s.kerf || 0)) + row('losses', `${fmt(s.start_loss || 0)} / ${fmt(s.end_loss || 0)} mm`);
  } else {
    const parts = Object.fromEntries((lastJob?.parts || []).map(p => [p.id, p]));
    const placed = res.sheets.flatMap(sh => sh.placements), keep = res.sheets.flatMap(sh => sh.offcuts.filter(o => o.reusable));
    const cuts = res.sheets.flatMap(sh => sh.cuts);
    const firsts = [...new Set(res.sheets.map(sh => sh.first_cut))].map(a => t(a === 'length' ? 'along_length' : 'along_width').toLowerCase()).join(', ');
    html += row('total_sheets', `${res.sheets.length} (${m2(res.sheets.reduce((a, sh) => a + sh.length * sh.width, 0))})`)
      + row('total_parts', `${placed.length} (${m2(placed.reduce((a, p) => a + (parts[p.part_id]?.length || 0) * (parts[p.part_id]?.width || 0), 0))})`)
      + row('total_offcuts', `${keep.length} (${m2(keep.reduce((a, o) => a + o.length * o.width, 0))})`)
      + row('total_cuts', `${cuts.length} (${mt(cuts.reduce((a, c) => a + c.to - c.from, 0))})`)
      + row('plans', grouped(res.sheets, sheetKey).length)
      + row('kerf', fmt(s.kerf || 0)) + row('edge_trim', fmt(s.edge_trim || 0))
      + row('stages', s.stages || 3) + row('first_cut', esc(s.first_cut ? firsts : `${t('auto').toLowerCase()} (${firsts})`));
  }
  return html + '</div>';
}

const sheetKey = sh => sh.stock_id + '|' + sh.first_cut + '|' + sh.placements.map(p => [p.part_id, p.x, p.y, p.rotated ? 1 : 0].join(',')).join(';');

// The numbering of a layout: parts in the order they first appear on the
// sheet, as the report numbers them.
function rowsOf(sh) {
  const rows = [], at = {};
  for (const p of sh.placements) {
    if (at[p.part_id] !== undefined) { rows[at[p.part_id]].qty++; continue; }
    at[p.part_id] = rows.length;
    rows.push({ n: rows.length + 1, id: p.part_id, qty: 1, rotated: !!p.rotated });
  }
  return { rows, at };
}

// One sheet drawn standing up, like the report: across the page is the
// sheet width (Y), down the page its length (X). The small one has no text.
function sheetSvg(sh, small) {
  const parts = Object.fromEntries((lastJob?.parts || []).map(p => [p.id, p]));
  const trim = lastJob?.settings?.edge_trim || 0;
  const W = sh.width, L = sh.length, sw = L / (small ? 260 : 700);
  const { at } = rowsOf(sh);
  let svg = `<svg viewBox="${-sw} ${-sw} ${W + 2 * sw} ${L + 2 * sw}">
    <defs><pattern id="dots" width="${L / 90}" height="${L / 90}" patternUnits="userSpaceOnUse"><circle cx="${L / 180}" cy="${L / 180}" r="${L / 900}" fill="#777"/></pattern></defs>
    <rect x="0" y="0" width="${W}" height="${L}" fill="#fff" stroke="#000" stroke-width="${sw * 1.5}"/>
    <rect x="${trim}" y="${trim}" width="${W - 2 * trim}" height="${L - 2 * trim}" fill="${small ? '#f2f2f2' : 'url(#dots)'}"/>`;
  for (const o of sh.offcuts) if (o.reusable) {
    svg += `<rect x="${o.y}" y="${o.x}" width="${o.width}" height="${o.length}" fill="${small ? '#c9efd2' : '#e8f7ec'}" stroke="#1a7f37" stroke-width="${sw}" ${small ? '' : `stroke-dasharray="${sw * 6} ${sw * 4}"`}/>`;
    if (!small) { const fs = Math.min(W / 30, o.length * 0.3, o.width * 0.12); svg += `<text x="${o.y + o.width / 2}" y="${o.x + o.length / 2}" style="font-size:${fs}px" text-anchor="middle" dominant-baseline="middle" fill="#1a7f37">${fmt(o.width)} × ${fmt(o.length)}</text>`; }
  }
  for (const p of sh.placements) {
    const part = parts[p.part_id] || { length: 0, width: 0 };
    const down = p.rotated ? part.width : part.length, across = p.rotated ? part.length : part.width;
    svg += `<rect x="${p.y}" y="${p.x}" width="${across}" height="${down}" fill="${small ? colourOf(p.part_id) : '#fff'}" stroke="#000" stroke-width="${sw}"/>`;
    if (small) continue;
    const fs = Math.min(W / 26, down * 0.22, across * 0.14);
    const cx = p.y + across / 2, cy = p.x + down / 2;
    svg += `<text x="${cx}" y="${cy - fs * 0.35}" text-anchor="middle" fill="#000" style="font-size:${fs}px"><tspan font-weight="700" style="font-size:${fs}px">${at[p.part_id] + 1}</tspan> <tspan style="font-size:${fs}px">${esc(p.part_id)}</tspan></text>
      <text x="${cx}" y="${cy + fs * 0.85}" text-anchor="middle" fill="#333" style="font-size:${fs * 0.85}px">${fmt(across)} × ${fmt(down)}</text>`;
  }
  return svg + '</svg>';
}

function partsTable(sh) {
  const parts = Object.fromEntries((lastJob?.parts || []).map(p => [p.id, p]));
  const { rows } = rowsOf(sh);
  return `<table class="parts"><tr><th>N</th><th>${esc(t('id'))}</th><th>${esc(t('desc'))}</th><th class="r">${esc(t('size'))}</th><th class="r">${esc(t('qty'))}</th></tr>` +
    rows.map(r => {
      const p = parts[r.id] || { length: 0, width: 0 };
      const across = r.rotated ? p.length : p.width, down = r.rotated ? p.width : p.length;
      return `<tr><td class="k">${r.n}</td><td>${esc(r.id)}</td><td>${esc(metaOf(r.id).desc)}</td><td class="r">${fmt(across)} × ${fmt(down)}</td><td class="r">${r.qty}</td></tr>`;
    }).join('') + '</table>';
}

function drawSheets(res, mi) {
  const groups = grouped(res.sheets, sheetKey);
  const along = a => t(a === 'length' ? 'along_length' : 'along_width').toLowerCase();
  // The overview: every different plan, small. A click goes to the big one.
  let html = `<h2>${esc(t('overview'))}</h2><div class="thumbs">` + groups.map(g =>
    `<div class="thumb" onclick="document.getElementById('item-${mi}-${g.first}').scrollIntoView({behavior:'smooth'})">
      ${g.count > 1 ? `<span class="n">${g.count}</span>` : ''}${sheetSvg(g.item, true)}
      <div class="cap"><span>${esc(t('sheet'))} ${g.count > 1 ? `${g.first}–${g.first + g.count - 1}` : g.first}</span><span>${fmt(sheetUse([g.item]) * 100)}%</span></div></div>`).join('') + '</div>';
  return html + groups.map(g => {
    const sh = g.item;
    const cuts = sh.cuts.map(c => `<li>${esc(t('stage'))} ${c.stage} · ${esc(along(c.along))} · ${esc(t('at'))} <b>${fmt(c.pos)}</b> (${esc(t('from'))} ${fmt(c.from)} ${esc(t('to'))} ${fmt(c.to)})</li>`).join('');
    const keep = sh.offcuts.filter(o => o.reusable).map(o => `${fmt(o.width)} × ${fmt(o.length)}`).join(', ') || t('none');
    return `<div class="item" id="item-${mi}-${g.first}"><h3>${esc(t('sheet'))} ${range(g)} <small>· ${esc(sh.stock_id)} · ${fmt(sh.width)} × ${fmt(sh.length)} mm · ${fmt(sheetUse([sh]) * 100)}% · ${esc(t('first'))}: ${esc(along(sh.first_cut))}</small></h3>
      <div class="layout"><div class="draw">${sheetSvg(sh, false)}</div><div class="list">${partsTable(sh)}
      <p class="line">${esc(t('offcuts'))}: ${esc(keep)}</p>
      <details><summary>${esc(t('cuts'))} (${sh.cuts.length})</summary><ol>${cuts}</ol></details></div></div></div>`;
  }).join('');
}

drawAll();
</script>
</body>
</html>
